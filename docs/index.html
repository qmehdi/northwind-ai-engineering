<span class=\"w\"> <\/span>--region<span class=\"w\"> <\/span>us-central1\ngcloud<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>services<span class=\"w\"> <\/span>update-traffic<span class=\"w\"> <\/span>northwind-agent<span class=\"w\"> <\/span>--region<span class=\"w\"> <\/span>us-central1<span class=\"w\"> <\/span>--to-revisions<span class=\"w\"> <\/span>&lt;previous<span class=\"w\"> <\/span>revision&gt;<span class=\"o\">=<\/span><span class=\"m\">100<\/span>\n<\/code><\/pre><\/div>\n\n<\/div>\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>The broken revision never receives traffic because its startup probe fails on <code>/readyz<\/code>. The rollback is one command that you have now run. Put it in your notes: that is the runbook.<\/p>\n<\/div>"}, {"title": "Capstone: cost per resolved ticket, before and after", "check": "Two numbers on the board: cost per resolution through the loop, and through the router", "optional": false, "html": "<p>The router is implemented in <code>nw/agent/router.py<\/code>: Project 1 first, then the cheapest loop that will do. Run fifty tickets both ways against your deployed service.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>python<span class=\"w\"> <\/span>-<span class=\"w\"> <\/span><span class=\"s\">&lt;&lt;'PY'<\/span>\n<span class=\"s\">import json, httpx, statistics, os<\/span>\n<span class=\"s\">AGENT = os.environ[\"AGENT\"]<\/span>\n<span class=\"s\">rows = [json.loads(l) for l in open(\"data/tickets.jsonl\")][:50]<\/span>\n<span class=\"s\">def run(path):<\/span>\n<span class=\"s\">    costs = []<\/span>\n<span class=\"s\">    for r in rows:<\/span>\n<span class=\"s\">        body = {\"task\": r[\"body\"], \"ticket_id\": r[\"ticket_id\"], \"account_id\": r[\"account_id\"], \"subject\": r[\"subject\"]}<\/span>\n<span class=\"s\">        resp = httpx.post(f\"{AGENT}{path}\", json=body, timeout=120).json()<\/span>\n<span class=\"s\">        costs.append(resp[\"cost_usd\"])<\/span>\n<span class=\"s\">    return statistics.mean(costs), sum(costs)<\/span>\n<span class=\"s\">loop_mean, loop_total = run(\"/run\")<\/span>\n<span class=\"s\">route_mean, route_total = run(\"/route\")<\/span>\n<span class=\"s\">print(f\"loop:   {loop_mean:.4f} USD per ticket, {loop_total:.2f} total\")<\/span>\n<span class=\"s\">print(f\"router: {route_mean:.4f} USD per ticket, {route_total:.2f} total, saving {100*(1-route_total/max(loop_total,1e-9)):.0f}%\")<\/span>\n<span class=\"s\">PY<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>The router is cheaper by a large margin: every P0 costs nothing, every P3 runs on the Economy model, and only the middle runs the Workhorse. Put both numbers on the board. Then ask the question the number raises: at Northwind's eight thousand tickets a quarter, what does each architecture cost, and who signs off on the difference?<\/p>\n<\/div>\n<div class=\"admonition agent\">\n<p class=\"admonition-title\">With the agent<\/p>\n<p><code>/trace-replay<\/code> on one routed P0 and one Workhorse resolution. Read where the money went.<\/p>\n<\/div>"}, {"title": "Watch the Reference stack, then decide about yours", "check": "You can name the two places the escalation gate is enforced on the Reference stack", "optional": false, "html": "<p>The instructor deploys and demonstrates the Reference stack for your track: the agent on the managed agent runtime, the tool registry behind a gateway with a policy, the native guardrail, the managed vector index, and the registry record. Follow along in <code>deploy/aws/stacks/reference.py<\/code> or <code>deploy/gcp/reference/main.tf<\/code>.<\/p>\n<p>Watch for three things:<\/p>\n<ol>\n<li>The gateway denying <code>escalate<\/code> to the agent's own identity. Same rule as your loop, enforced by the platform.<\/li>\n<li>The guardrail or Model Armor blocking the injection ticket before any model runs, and the trajectory recording it.<\/li>\n<li>The cost sheet line for what the stack costs per day of demos, and what <code>destroy<\/code> leaves behind.<\/li>\n<\/ol>\n<p>Then decide about your own deployment. Leaving it running costs what the cost sheet says. Destroying it costs nothing and the images are rebuilt in minutes.<\/p>\n<div class=\"track-aws\">\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>destroy-aws<span class=\"w\"> <\/span><span class=\"nv\">TIER<\/span><span class=\"o\">=<\/span>session\n<\/code><\/pre><\/div>\n\n<\/div>\n<div class=\"track-gcp\">\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>destroy-gcp<span class=\"w\"> <\/span><span class=\"nv\">TIER<\/span><span class=\"o\">=<\/span>session\n<\/code><\/pre><\/div>\n\n<\/div>\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>The stack deletes in a few minutes. The budget alarm you created stays until you delete it, which is the right default.<\/p>\n<\/div>"}, {"title": "Session check, demos, debrief", "check": "<code>/session-check 6<\/code> reports every criterion met and your endpoint answered a ticket during the demo", "optional": false, "html": "<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>session06\nmake<span class=\"w\"> <\/span>check\ngit<span class=\"w\"> <\/span>add<span class=\"w\"> <\/span>-A<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>git<span class=\"w\"> <\/span>commit<span class=\"w\"> <\/span>-m<span class=\"w\"> <\/span><span class=\"s2\">\"Session 6: deployed, measured, routed\"<\/span>\n<\/code><\/pre><\/div>\n\n<p>Three volunteers, three minutes each, live endpoint only, no slides. Then the debrief questions from the deck.<\/p>\n<p><code>/session-check 6<\/code> in your agent reads the cost sheet numbers you wrote down in Step 2, the two latency numbers from Step 5, the rollback command, and the two cost-per-resolution numbers from Step 6.<\/p>"}]}]};</script>
<script>(function () {
  const C = window.COURSE;
  const KEY = "nw-guide-v1";
  let state = load();
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

  function load() {
    let st = { track: "aws", session: 1, step: {}, done: {}, tab: "instructions" };
    try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
    // Deep links: #session-3/step-2, #session-3/reference, #track-gcp
    const h = location.hash.slice(1);
    const m = h.match(/^session-(\d+)(?:\/(reference|step-(\d+)))?/);
    if (m) { st.session = +m[1]; st.tab = m[2] === "reference" ? "reference" : "instructions"; if (m[3]) st.step[st.session] = +m[3] - 1; }
    const t = h.match(/track-(aws|gcp)/); if (t) st.track = t[1];
    return st;
  }
  function syncHash() {
    const s = session();
    const part = state.tab === "reference" ? "reference" : "step-" + ((state.step[s.n] || 0) + 1);
    const next = "#session-" + s.n + "/" + part;
    if (location.hash !== next) history.replaceState(null, "", next);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function session() { return C.sessions.find(s => s.n === state.session) || C.sessions[0]; }
  function stepIndex(s) { return state.step[s.n] || 0; }
  function isDone(s, i) { return !!state.done[s.n + ":" + i]; }
  function required(s) { return s.steps.filter(st => !st.optional); }
  function pct(s) {
    const req = required(s); if (!req.length) return 0;
    const done = s.steps.filter((st, i) => !st.optional && isDone(s, i)).length;
    return Math.round(100 * done / req.length);
  }
  function total() {
    const all = C.sessions.reduce((a, s) => a + required(s).length, 0);
    const done = C.sessions.reduce((a, s) => a + s.steps.filter((st, i) => !st.optional && isDone(s, i)).length, 0);
    return all ? Math.round(100 * done / all) : 0;
  }

  function renderSide() {
    document.body.dataset.track = state.track;
    $$(".track button").forEach(b => b.classList.toggle("on", b.dataset.track === state.track));
    const ul = $(".sessions"); ul.innerHTML = "";
    C.sessions.forEach(s => {
      const li = document.createElement("li");
      li.className = s.n === state.session ? "on" : "";
      li.innerHTML = `<span class="n">${s.n}</span><span>${s.title}</span><span class="pct">${s.steps.length ? pct(s) + "%" : ""}</span>`;
      li.onclick = () => { state.session = s.n; save(); render(); };
      ul.appendChild(li);
    });
    $(".progress i").style.width = total() + "%";
    $(".progress-label").textContent = "Course progress " + total() + "%";
  }

  function renderMain() {
    const s = session();
    $(".eyebrow").textContent = "Session " + s.n + " of " + C.sessions.length;
    $("h1").textContent = s.title;
    $(".builds").textContent = "You build: " + s.builds;
    $$(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
    const ins = $("#instructions"), ref = $("#reference");
    ins.hidden = state.tab !== "instructions"; ref.hidden = state.tab !== "reference";
    ref.innerHTML = s.reference_html || "<p>Reference material for this session is not written yet.</p>";
    if (!s.steps.length) { ins.innerHTML = "<div class='card'><p>The steps for this session are not published yet.</p></div>"; return; }
    const i = Math.min(stepIndex(s), s.steps.length - 1);
    const st = s.steps[i];
    const chips = s.steps.map((x, k) => `<li class="${k === i ? "on" : ""} ${isDone(s, k) ? "done" : ""}" data-i="${k}">${k + 1}. ${x.title}</li>`).join("");
    const complete = pct(s) === 100 ? `<div class="complete">Session ${s.n} complete. Every step check is done.</div>` : "";
    ins.innerHTML = `${complete}<ul class="steps">${chips}</ul>
      <div class="step">
        ${st.optional ? '<div class="optional">Try this too, optional</div>' : ""}
        <h2>Step ${i + 1}. ${st.title}</h2>
        <div class="card">${st.html}</div>
        <label class="check"><input type="checkbox" ${isDone(s, i) ? "checked" : ""}><span><b>Step check</b>${st.check}</span></label>
        <div class="nav">
          <button class="prev" ${i === 0 ? "disabled" : ""}>Previous</button>
          <button class="next primary" ${i === s.steps.length - 1 ? "disabled" : ""}>Next: ${s.steps[i + 1] ? s.steps[i + 1].title : "done"}</button>
        </div>
      </div>`;
    $$(".steps li", ins).forEach(li => li.onclick = () => { state.step[s.n] = +li.dataset.i; save(); render(); window.scrollTo(0, 0); });
    $(".check input", ins).onchange = e => { state.done[s.n + ":" + i] = e.target.checked; save(); render(); };
    $(".prev", ins).onclick = () => { state.step[s.n] = i - 1; save(); render(); window.scrollTo(0, 0); };
    $(".next", ins).onclick = () => { state.step[s.n] = i + 1; save(); render(); window.scrollTo(0, 0); };
    $$("pre", document).forEach(pre => {
      if (pre.querySelector(".copy")) return;
      const b = document.createElement("button"); b.className = "copy"; b.textContent = "Copy";
      b.onclick = () => { navigator.clipboard.writeText(pre.innerText.replace(/^Copy\n?/, "")).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); }); };
      pre.appendChild(b);
    });
    $$("table").forEach(t => { if (!t.parentElement.classList.contains("tablewrap")) { const w = document.createElement("div"); w.className = "tablewrap"; t.parentNode.insertBefore(w, t); w.appendChild(t); } });
  }

  function render() { renderSide(); renderMain(); syncHash(); }
  $$(".track button").forEach(b => b.onclick = () => { state.track = b.dataset.track; save(); render(); });
  $$(".tabs button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; save(); render(); });
  render();
})();
</script>
</body></html>
