<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind AI Engineering</title><style>:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5b6573; --line: #e3e6eb;
  --accent: #0f6fff; --accent-ink: #ffffff; --ok: #1a8f4b; --warn: #b7791f; --code-bg: #f1f3f6;
  --aws: #c7741a; --gcp: #2b7de9; --side: 300px; --radius: 10px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1318; --panel: #171c23; --ink: #e6e9ee; --muted: #9aa4b1; --line: #2a3140;
          --accent: #5b9dff; --accent-ink: #0b1220; --code-bg: #10151c; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.55; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.brand small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; margin-top: 2px; }
.role { font-size: 13px; color: var(--muted); margin: 14px 0 18px; border-left: 3px solid var(--accent); padding-left: 10px; }
.track { display: flex; gap: 6px; margin: 8px 0 18px; }
.track button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.track button.on.aws { background: var(--aws); border-color: var(--aws); color: #fff; }
.track button.on.gcp { background: var(--gcp); border-color: var(--gcp); color: #fff; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 6px; }
.sessions { list-style: none; margin: 0; padding: 0; }
.sessions li { padding: 9px 10px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.sessions li:hover { background: var(--bg); }
.sessions li.on { background: var(--accent); color: var(--accent-ink); }
.sessions li .n { font-weight: 700; }
.sessions li .pct { font-size: 12px; opacity: .8; }
.progress { height: 6px; background: var(--line); border-radius: 3px; margin: 10px 0 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.main { padding: 28px 40px 80px; max-width: 980px; }
.eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
h1 { font-size: 30px; margin: 4px 0 6px; line-height: 1.2; }
.builds { color: var(--muted); margin-bottom: 18px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 10px 0 22px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.steps { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.steps li { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; background: var(--panel); }
.steps li.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.steps li.done { border-color: var(--ok); color: var(--ok); }
.steps li.done::before { content: "\2713  "; }
.step h2 { font-size: 24px; margin: 0 0 4px; }
.step .optional { color: var(--warn); font-size: 13px; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; }
.card h3 { margin-top: 24px; font-size: 18px; }
.card h3:first-child { margin-top: 0; }
pre { position: relative; padding-right: 72px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.5; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
p code, li code, td code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 90%; }
.copy { position: absolute; top: 6px; right: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.copy:hover { color: var(--ink); }
.admonition { border-left: 4px solid var(--accent); background: var(--bg); padding: 10px 14px; border-radius: 6px; margin: 14px 0; }
.admonition-title { font-weight: 700; margin: 0 0 4px; font-size: 14px; }
.admonition.expect { border-color: var(--ok); }
.admonition.warning { border-color: var(--warn); }
.admonition.agent { border-color: #8b5cf6; }
.track-aws, .track-gcp { display: none; border: 1px dashed var(--line); border-radius: 8px; padding: 4px 14px; margin: 12px 0; }
.track-aws::before, .track-gcp::before { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; color: #fff; margin: 8px 0 2px; }
.track-aws::before { content: "AWS TRACK"; background: var(--aws); }
.track-gcp::before { content: "GCP TRACK"; background: var(--gcp); }
body[data-track="aws"] .track-aws, body[data-track="gcp"] .track-gcp { display: block; }
.check { margin-top: 22px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); display: flex; gap: 12px; align-items: flex-start; }
.check input { margin-top: 5px; transform: scale(1.2); }
.check b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.nav { display: flex; justify-content: space-between; margin-top: 22px; }
.nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.nav button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nav button:disabled { opacity: .4; cursor: default; }
.complete { margin: 0 0 18px; padding: 14px 18px; border-radius: var(--radius); background: var(--ok); color: #fff; font-weight: 600; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14.5px; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--bg); }
.tablewrap { overflow-x: auto; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } .side { position: static; height: auto; } .main { padding: 20px; } }

    <div class="eyebrow"></div>

<script>window.COURSE = {"title": "Northwind AI Engineering", "subtitle": "AI Engineering: GenAI and Agentic Systems", "role": "You are the AI engineer Northwind Cloud hired to make the support desk faster without making it dangerous.", "repo_url": "https://github.com/techwithshadab/northwind-ai-engineering", "sessions": [{"n": 1, "title": "Foundations and the AI service layer", "builds": "Shared service layer", "reference_html": "<h2 id=\"situation\">Situation<\/h2>\n<p>Northwind Cloud's support desk answers about eight thousand tickets a quarter. Every project in this course calls a model, and every one of them will hit the same three walls: fan-out that opens too many connections, a provider that rate-limits or fails mid-batch, and model output that is almost, but not quite, valid JSON. Session 1 solves those once, in <code>nw/llm<\/code>, so Sessions 2 to 6 never solve them again.<\/p>\n<h2 id=\"where-time-goes-in-an-ai-service\">Where time goes in an AI service<\/h2>\n<p>A model call is network I/O. A laptop waits on the provider for hundreds of milliseconds to several seconds per call and does almost no work of its own. That decides the concurrency model: <code>asyncio<\/code> with one shared <code>httpx<\/code> connection pool per process, and a semaphore to keep the number of calls in flight below the provider's rate limit. Threads would work; processes would waste memory on idle interpreters.<\/p>\n<table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>Cause<\/th>\n<th>Fix in this session<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>500 prompts, 500 open connections, then 429s<\/td>\n<td>unbounded <code>asyncio.gather<\/code><\/td>\n<td>the semaphore in <code>LLMClient.complete<\/code><\/td>\n<\/tr>\n<tr>\n<td>Batch fails at prompt 312 and everything is lost<\/td>\n<td>no retry, no partial results<\/td>\n<td><code>_with_retries<\/code>, <code>map(return_exceptions=True)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>json.loads<\/code> raises on a reply that starts with \"Sure, here is\"<\/td>\n<td>trusting the model's formatting<\/td>\n<td><code>structured<\/code> with one repair round trip<\/td>\n<\/tr>\n<tr>\n<td>The bill is a surprise at month end<\/td>\n<td>nobody counted tokens<\/td>\n<td>the cost meter and the spend cap<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"retryable-and-terminal-are-different-failures\">Retryable and terminal are different failures<\/h2>\n<p>The provider tells you which is which. Retrying a 400 wastes money and time; not retrying a 429 fails work that would have succeeded a second later.<\/p>\n<table>\n<thead>\n<tr>\n<th>Status or error<\/th>\n<th>Family<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>429 rate limit<\/td>\n<td>retryable<\/td>\n<td>back off, honour <code>Retry-After<\/code><\/td>\n<\/tr>\n<tr>\n<td>529 overloaded, 500, 502, 503<\/td>\n<td>retryable<\/td>\n<td>the provider's problem, transient<\/td>\n<\/tr>\n<tr>\n<td>timeout, connection reset<\/td>\n<td>retryable<\/td>\n<td>network, transient<\/td>\n<\/tr>\n<tr>\n<td>400 bad request<\/td>\n<td>terminal<\/td>\n<td>your request is wrong; it will be wrong again<\/td>\n<\/tr>\n<tr>\n<td>401, 403<\/td>\n<td>terminal<\/td>\n<td>credentials<\/td>\n<\/tr>\n<tr>\n<td>404 model not found<\/td>\n<td>terminal<\/td>\n<td>wrong ID or region<\/td>\n<\/tr>\n<tr>\n<td>refusal stop reason<\/td>\n<td>terminal<\/td>\n<td>the content, not the call<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Backoff uses full jitter: a uniform random delay between zero and a ceiling that doubles per attempt. Without jitter, every client that failed at the same instant retries at the same instant, and the provider sees the same spike again.<\/p>\n<h2 id=\"structured-output-is-a-contract-not-a-hope\">Structured output is a contract, not a hope<\/h2>\n<p>The client tells the model the JSON Schema of the Pydantic class it wants, parses the reply, and validates it. When validation fails, the error message goes back to the model once, with the original reply, and the model corrects itself. After the second failure the client raises. A loop that keeps asking is a budget leak; a single repair fixes the large majority of malformed replies in practice.<\/p>\n<p>Nothing outside <code>nw/llm/providers/<\/code> sees a vendor object. Provider-specific structured output features exist and are faster on some vendors, but the validation in your own code is what survives a vendor change.<\/p>\n<h2 id=\"cost-is-a-first-class-output\">Cost is a first-class output<\/h2>\n<p>Every completion is priced from a table in <code>nw/llm/prices.py<\/code> and recorded with its correlation ID. The meter reserves an estimate before each call, so a burst of concurrent calls cannot all squeeze under the cap at once, and replaces the reservation with the real cost afterwards. In Session 6 the same numbers become the cost per resolved ticket on a dashboard.<\/p>\n<p>The price table is a list price snapshot. Bedrock and Vertex bill at their own rates, so treat every figure as an estimate until the cloud bill confirms it.<\/p>\n<h2 id=\"questions-worth-asking\">Questions worth asking<\/h2>\n<ul>\n<li>What is the right <code>max_concurrency<\/code> for a provider that allows 50 requests per minute? What if two services share the account?<\/li>\n<li>The repair round trip costs a second call. When is it cheaper to fail fast?<\/li>\n<li>Which of this session's failures would have reached production in your current setup?<\/li>\n<\/ul>\n<h2 id=\"what-you-built\">What you built<\/h2>\n<p><code>LLMClient<\/code> in front of any provider: bounded concurrency, provider-aware retries, validated structured output with one repair, ordered fan-out, cost metering with a hard cap, and a correlation ID on every log line. Sessions 2 to 6 import it and never open a connection to a model any other way.<\/p>", "steps": [{"title": "Set up and run preflight", "check": "<code>make preflight<\/code> prints READY", "optional": false, "html": "<p>Clone the repository, create the environment, and prove the machine is ready. Pick your track now and keep it for all six sessions.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>git<span class=\"w\"> <\/span>clone<span class=\"w\"> <\/span>https://github.com/techwithshadab/northwind-ai-engineering.git\n<span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>northwind-ai-engineering\nmake<span class=\"w\"> <\/span>setup\ncp<span class=\"w\"> <\/span>.env.example<span class=\"w\"> <\/span>.env\n<\/code><\/pre><\/div>\n\n<p>Edit <code>.env<\/code> for your track.<\/p>\n<div class=\"track-aws\">\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># .env<\/span>\n<span class=\"nv\">NW_TRACK<\/span><span class=\"o\">=<\/span>aws\n<span class=\"nv\">NW_AWS_REGION<\/span><span class=\"o\">=<\/span>us-east-1\n<span class=\"nv\">NW_AWS_PROFILE<\/span><span class=\"o\">=<\/span>default\n<\/code><\/pre><\/div>\n\n<p>Your AWS profile needs Bedrock model access for the three model roles in the chosen region. Model access is per region and per account; enable it in the Bedrock console before running preflight.<\/p>\n<\/div>\n<div class=\"track-gcp\">\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># .env<\/span>\n<span class=\"nv\">NW_TRACK<\/span><span class=\"o\">=<\/span>gcp\n<span class=\"nv\">NW_GCP_PROJECT<\/span><span class=\"o\">=<\/span>your-project-id\n<span class=\"nv\">NW_GCP_REGION<\/span><span class=\"o\">=<\/span>global\n<\/code><\/pre><\/div>\n\n<p>Authenticate once with <code>gcloud auth application-default login<\/code>, and enable the Vertex AI API on the project.<\/p>\n<\/div>\n<p>Then run preflight. On the aws and gcp tracks it makes one real round trip per model role, which costs a fraction of a cent.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>preflight\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>A table of PASS, WARN and FAIL lines and a final <code>READY<\/code>. WARN on <code>accelerator<\/code> is fine; Session 3 has a fallback. Any FAIL must be fixed before Session 1 starts: paste the table into the cohort channel.<\/p>\n<\/div>\n<p>If you have no cloud account yet, set <code>NW_TRACK=local<\/code>. Every exercise in this session runs against the fake provider and needs no network.<\/p>"}, {"title": "Read the contract and see the tests fail", "check": "<code>make session01<\/code> reports 19 failed, 5 passed", "optional": false, "html": "<p>Session 1 builds <code>nw/llm<\/code>. Before writing anything, read the contract you are implementing against. Three files, ten minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>What it fixes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>nw/llm/types.py<\/code><\/td>\n<td><code>Message<\/code>, <code>Completion<\/code>, <code>Usage<\/code>, <code>ToolCall<\/code>: the course's own shapes, never a vendor's<\/td>\n<\/tr>\n<tr>\n<td><code>nw/llm/provider.py<\/code><\/td>\n<td><code>LLMProvider.complete<\/code>: one round trip, raising only <code>RetryableError<\/code> or <code>TerminalError<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>nw/llm/errors.py<\/code><\/td>\n<td>The two error families and the three terminal specialisations<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Then look at how a real provider translates to and from those shapes in <code>nw/llm/providers/anthropic_base.py<\/code>, and how the fake in <code>nw/llm/providers/fake.py<\/code> lets tests script outcomes and count in-flight calls.<\/p>\n<p>Now run the acceptance tests.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>session01\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>19 failed, 5 passed. The five that pass cover the provider translation layer, which is given. The 19 that fail are your work: <code>retry.py<\/code> and four methods in <code>client.py<\/code>, each raising <code>NotImplementedError<\/code> with the step that fills it in.<\/p>\n<\/div>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Note<\/p>\n<p>The skeleton's imports were trimmed to what the stubs use. As you implement each method, add back the imports you need; <code>ruff<\/code> will tell you about any you left unused.<\/p>\n<\/div>"}, {"title": "Backoff with jitter, honouring Retry-After", "check": "<code>uv run pytest -q tests/session01/test_retry.py -k 'backoff or capped'<\/code> passes", "optional": false, "html": "<p>Open <code>nw/llm/retry.py<\/code> and implement <code>RetryPolicy.delay_for(attempt, retry_after_s)<\/code>.<\/p>\n<p>Rules, in order:<\/p>\n<ol>\n<li>If the provider sent <code>Retry-After<\/code>, wait that long, capped at <code>retry_after_cap_s<\/code>. Ignoring it is how you get banned.<\/li>\n<li>Otherwise, exponential backoff with full jitter: a uniform random delay between 0 and <code>min(max_delay_s, base_delay_s * 2 ** (attempt - 1))<\/code>.<\/li>\n<\/ol>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># nw/llm/retry.py<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">random<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">delay_for<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">,<\/span> <span class=\"n\">attempt<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">,<\/span> <span class=\"n\">retry_after_s<\/span><span class=\"p\">:<\/span> <span class=\"nb\">float<\/span> <span class=\"o\">|<\/span> <span class=\"kc\">None<\/span> <span class=\"o\">=<\/span> <span class=\"kc\">None<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">float<\/span><span class=\"p\">:<\/span>\n    <span class=\"o\">...<\/span>\n<\/code><\/pre><\/div>\n\n<p>Run the two pure tests:<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session01/test_retry.py<span class=\"w\"> <\/span>-k<span class=\"w\"> <\/span><span class=\"s2\">\"backoff or capped\"<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Both pass. The backoff test samples two hundred delays per attempt and checks they stay under the ceiling and are not all the same. If it reports \"no jitter\", you returned the ceiling instead of a random value under it.<\/p>\n<\/div>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Warning<\/p>\n<p>Do not add jitter to the <code>Retry-After<\/code> path. The provider chose that number.<\/p>\n<\/div>"}, {"title": "Complete with a semaphore, retries and metering", "check": "<code>uv run pytest -q tests/session01/test_retry.py tests/session01/test_concurrency.py tests/session01/test_cost.py<\/code> passes", "optional": false, "html": "<p>Open <code>nw/llm/client.py<\/code>. Two methods this step: <code>_with_retries<\/code> first, then <code>complete<\/code>.<\/p>\n<p><strong><code>_with_retries(request_id, call)<\/code><\/strong> runs <code>call()<\/code> under the policy:<\/p>\n<ul>\n<li><code>TerminalError<\/code>: raise at once. No sleep, no second attempt.<\/li>\n<li><code>RetryableError<\/code>: if this was the last allowed attempt, log and raise. Otherwise compute the delay with <code>self._retry.delay_for(attempt, exc.retry_after_s)<\/code>, log it, and <code>await self._sleep(delay)<\/code>. Use <code>self._sleep<\/code>, not <code>asyncio.sleep<\/code>, so the tests can record delays instead of waiting.<\/li>\n<\/ul>\n<p><strong><code>complete(prompt, ...)<\/code><\/strong> is the order of operations that matters:<\/p>\n<ol>\n<li>Build <code>messages<\/code> (a string becomes one user <code>Message<\/code>), resolve the model from the role, make a short <code>request_id<\/code>, estimate the cost.<\/li>\n<li>Take the semaphore: <code>async with self._sem:<\/code>. Everything that holds budget happens inside it, so a thousand queued calls do not reserve a thousand estimates.<\/li>\n<li>Inside it, <code>self.meter.reserve(estimate)<\/code>. This raises <code>SpendCapExceeded<\/code> before any network happens. Then call the provider through <code>_with_retries<\/code>.<\/li>\n<li>In a <code>finally<\/code>, <code>self.meter.release(estimate)<\/code>.<\/li>\n<li>After the semaphore, <code>self.meter.record(...)<\/code> the real usage with <code>correlation_id()<\/code>, and log one line with <code>log_fields(...)<\/code>: request ID, model, role, tokens, latency, cost, spend so far, stop reason.<\/li>\n<\/ol>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session01/test_retry.py<span class=\"w\"> <\/span>tests/session01/test_concurrency.py<span class=\"w\"> <\/span>tests/session01/test_cost.py\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>All pass. If <code>test_semaphore_bounds_in_flight_requests<\/code> fails with a high-water mark above 8, the semaphore is not around the provider call. If <code>test_spend_cap_stops_calls_before_they_are_made<\/code> fails, the reservation happens after the call or is never released. If <code>test_queued_calls_do_not_reserve_before_the_semaphore<\/code> fails, the reservation is outside the semaphore.<\/p>\n<\/div>\n<div class=\"admonition agent\">\n<p class=\"admonition-title\">With the agent<\/p>\n<p>Ask your coding agent to review <code>complete<\/code> against the five steps above before you run the tests, using <code>/code-review<\/code>. Accept nothing it changes that the tests do not cover.<\/p>\n<\/div>"}, {"title": "Structured output with one repair round trip", "check": "<code>uv run pytest -q tests/session01/test_structured.py<\/code> passes", "optional": false, "html": "<p>Implement <code>LLMClient.structured(prompt, schema, ...)<\/code>. The helper <code>_parse_as(text, schema)<\/code> is given: it strips a code fence, finds the outermost braces, parses JSON and validates against the Pydantic class, raising <code>ValueError<\/code> or <code>ValidationError<\/code>.<\/p>\n<ol>\n<li>Build the system prompt: the caller's <code>system<\/code> if any, then an instruction to reply with a single JSON object and nothing else, then the schema from <code>schema.model_json_schema()<\/code>.<\/li>\n<li>Call <code>self.complete(messages, role=role, system=instructions, max_tokens=max_tokens)<\/code> and try <code>_parse_as<\/code>.<\/li>\n<li>On failure, append the model's reply as an assistant turn and a user turn that says it was not valid, includes the error, and asks for the corrected JSON only. Try once more.<\/li>\n<li>After the second failure raise <code>StructuredOutputError<\/code>.<\/li>\n<\/ol>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session01/test_structured.py\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Five pass. <code>test_one_repair_round_trip<\/code> inspects the second call and expects the phrase \"not valid\" in the last user turn. <code>test_fails_after_second_bad_reply<\/code> expects exactly two provider calls, not three.<\/p>\n<\/div>\n<p>This is the pattern that transfers most directly to production work: the schema is the contract, the model's formatting is not trusted, and the retry is bounded.<\/p>"}, {"title": "Fan out and keep the order", "check": "<code>make session01<\/code> reports 24 passed", "optional": false, "html": "<p>Implement <code>LLMClient.map(prompts, ...)<\/code>: one <code>complete<\/code> per prompt, run concurrently, results in input order.<\/p>\n<p>Most people reach for <code>asyncio.as_completed<\/code> here because it feels natural. It yields results in completion order and silently scrambles them. <code>asyncio.gather(*tasks, return_exceptions=True)<\/code> preserves order. With <code>return_exceptions=False<\/code>, the default, raise the first exception found in the results; otherwise return them in place.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session01/test_map.py\nmake<span class=\"w\"> <\/span>session01\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>24 passed. <code>test_order_is_preserved_when_replies_return_out_of_order<\/code> makes the first prompt answer last; if your results come back reversed, you used completion order.<\/p>\n<\/div>\n<p>Run the whole check that CI runs, then commit.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>check\ngit<span class=\"w\"> <\/span>add<span class=\"w\"> <\/span>-A<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>git<span class=\"w\"> <\/span>commit<span class=\"w\"> <\/span>-m<span class=\"w\"> <\/span><span class=\"s2\">\"Session 1: shared service layer\"<\/span>\n<\/code><\/pre><\/div>"}, {"title": "Install the skill set and set the review convention", "check": "<code>/session-check 1<\/code> reports every Session 1 criterion met", "optional": false, "html": "<p>The rest of the course is built with a coding agent alongside you. The rule from here on: agent-written code is held to the same bar as anything else. It passes the tests or it does not go in.<\/p>\n<p>Install the course skill set as a Claude Code plugin, pinned to the cohort's tag.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>npx<span class=\"w\"> <\/span>skills@latest<span class=\"w\"> <\/span>add<span class=\"w\"> <\/span>techwithshadab/skills\n<\/code><\/pre><\/div>\n\n<p>Then, in your agent, run the session check.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>/session-check 1\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>The skill runs <code>make session01<\/code> and <code>make lint<\/code>, reads the acceptance criteria for Session 1, and reports each one as met or not with the evidence. If it reports something the tests did not catch, that is a finding to fix, not a reason to argue with the skill.<\/p>\n<\/div>\n<p>The convention for every later session:<\/p>\n<table>\n<thead>\n<tr>\n<th>When<\/th>\n<th>Skill<\/th>\n<th>What you do with the output<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Starting an exercise<\/td>\n<td><code>/tdd<\/code><\/td>\n<td>Let it write the failing test first; keep only tests you would have written<\/td>\n<\/tr>\n<tr>\n<td>Before running acceptance tests<\/td>\n<td><code>/code-review<\/code><\/td>\n<td>Read every finding; accept changes only where a test covers them<\/td>\n<\/tr>\n<tr>\n<td>Something spins or hangs<\/td>\n<td><code>/diagnosing-bugs<\/code><\/td>\n<td>Follow its loop; do not patch on a guess<\/td>\n<\/tr>\n<tr>\n<td>Ending a session<\/td>\n<td><code>/session-check N<\/code><\/td>\n<td>Nothing is done until it reports every criterion met<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"title": "One live call on your track", "check": "A JSON log line shows a real model, its latency, and a non-zero cost", "optional": true, "html": "<p>Everything so far ran against the fake provider. Make one real call on your track and read the log line.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>python<span class=\"w\"> <\/span>scripts/live_check.py\n<\/code><\/pre><\/div>\n\n<p>The script is short enough to read first:<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># scripts/live_check.py<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">asyncio<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">nw.config<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">settings<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">nw.llm<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">LLMClient<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">nw.llm.providers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">make_provider<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">nw.logging<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">bind_correlation_id<\/span><span class=\"p\">,<\/span> <span class=\"n\">configure_logging<\/span>\n\n<span class=\"n\">configure_logging<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"json\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">s<\/span> <span class=\"o\">=<\/span> <span class=\"n\">settings<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">client<\/span> <span class=\"o\">=<\/span> <span class=\"n\">LLMClient<\/span><span class=\"p\">(<\/span><span class=\"n\">make_provider<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">),<\/span> <span class=\"n\">settings<\/span><span class=\"o\">=<\/span><span class=\"n\">s<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">async<\/span> <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">()<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"kc\">None<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">with<\/span> <span class=\"n\">bind_correlation_id<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"live-check\"<\/span><span class=\"p\">):<\/span>\n        <span class=\"n\">c<\/span> <span class=\"o\">=<\/span> <span class=\"k\">await<\/span> <span class=\"n\">client<\/span><span class=\"o\">.<\/span><span class=\"n\">complete<\/span><span class=\"p\">(<\/span>\n            <span class=\"s2\">\"Name one thing a support ticket should always include.\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">60<\/span>\n        <span class=\"p\">)<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">c<\/span><span class=\"o\">.<\/span><span class=\"n\">text<\/span><span class=\"p\">)<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"spend so far: <\/span><span class=\"si\">{<\/span><span class=\"n\">client<\/span><span class=\"o\">.<\/span><span class=\"n\">spend_usd<\/span><span class=\"si\">:<\/span><span class=\"s2\">.6f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> USD\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">asyncio<\/span><span class=\"o\">.<\/span><span class=\"n\">run<\/span><span class=\"p\">(<\/span><span class=\"n\">main<\/span><span class=\"p\">())<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"track-aws\">\n<p>The log line shows <code>model: anthropic.claude-sonnet-5<\/code> and the provider request ID. A 403 here means Bedrock model access is not enabled for that model in <code>NW_AWS_REGION<\/code>.<\/p>\n<\/div>\n<div class=\"track-gcp\">\n<p>The log line shows <code>model: claude-sonnet-5<\/code> and the provider request ID. A 403 here means the Vertex AI API is not enabled or your credentials lack <code>roles/aiplatform.user<\/code> on the project.<\/p>\n<\/div>\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>One line of JSON on stderr with <code>correlation_id: live-check<\/code>, <code>latency_ms<\/code>, token counts and <code>cost_usd<\/code>, then the answer and the spend. Compare <code>cost_usd<\/code> with the price table in <code>nw/llm/prices.py<\/code>, and remember the table is a list-price snapshot.<\/p>\n<\/div>"}]}, {"n": 2, "title": "Machine learning in production", "builds": "Project 1: Ticket triage scoring service", "reference_html": "<h2 id=\"situation\">Situation<\/h2>\n<p>Northwind's support desk routes every ticket by hand. A P0, an outage or a security incident, waits in the same queue as a question about dark mode until someone reads it. Project 1 is a scoring service that assigns a priority the moment a ticket arrives, so the queue is ordered before a human looks at it. It has to be right about P0 far more often than it is right about anything else, and it has to run as a service with a version, a health check and a metrics endpoint, not as a notebook cell.<\/p>\n<h2 id=\"the-metric-that-survives-contact-with-the-business\">The metric that survives contact with the business<\/h2>\n<p>Accuracy on this data is a trap. P0 is about four percent of tickets, so a model that never predicts P0 is 96 percent accurate on that class and useless. The number Northwind cares about is P0 recall: of the real emergencies, how many did the model catch? Precision on P0 is the price: every false alarm pulls an engineer off something else.<\/p>\n<table>\n<thead>\n<tr>\n<th>Metric<\/th>\n<th>What it answers<\/th>\n<th>Why it matters here<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Accuracy<\/td>\n<td>How often is the top guess right?<\/td>\n<td>Dominated by the common classes; hides P0<\/td>\n<\/tr>\n<tr>\n<td>Macro-F1<\/td>\n<td>Average F1 across the four classes, equally weighted<\/td>\n<td>Rewards getting the rare class right<\/td>\n<\/tr>\n<tr>\n<td>P0 recall<\/td>\n<td>Of true P0s, how many were flagged?<\/td>\n<td>The commercial number: a missed P0 is an SLA breach<\/td>\n<\/tr>\n<tr>\n<td>P0 precision<\/td>\n<td>Of flagged P0s, how many were real?<\/td>\n<td>The cost of the recall you buy<\/td>\n<\/tr>\n<tr>\n<td>Brier score and ECE<\/td>\n<td>Do the probabilities mean what they say?<\/td>\n<td>A threshold on a badly calibrated probability is a threshold on noise<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"three-fixes-for-imbalance-in-order\">Three fixes for imbalance, in order<\/h2>\n<ol>\n<li><strong>Class weights.<\/strong> Tell the loss that a P0 mistake costs 25 times a P2 mistake. Cheap, and the first thing to try. It moves the decision boundary but leaves the probabilities biased.<\/li>\n<li><strong>A threshold, not argmax.<\/strong> Predict P0 whenever its probability clears a value chosen on the validation split to hit a recall target. This is where the business decision lives: the target recall and the precision floor are numbers a product owner can argue about.<\/li>\n<li><strong>Calibration.<\/strong> Fit a mapping from the classifier's scores to real probabilities on held-out data. After this, a threshold of 0.3 means \"three in ten of these are real\", and the dashboard's confidence number is honest.<\/li>\n<\/ol>\n<p>Resampling, oversampling P0 or undersampling P2, is a fourth option. On text with a linear model it rarely beats class weights and it makes the validation split lie, so it is not in the acceptance criteria.<\/p>\n<h2 id=\"reproducible-features\">Reproducible features<\/h2>\n<p>The feature pipeline is a fitted scikit-learn object serialised with the model. That is not a style choice. Train and serve skew, where the service tokenises differently from training, is the most common silent failure in deployed classical ML. One object, one file, one checksum.<\/p>\n<h2 id=\"why-a-linear-model\">Why a linear model<\/h2>\n<p>Logistic regression over word and character n-grams trains in seconds, its coefficients can be read, and on short support text it is hard to beat by more than a few points with anything heavier. Session 3 brings the transformer and the benchmark harness that shows exactly what the extra cost buys.<\/p>\n<h2 id=\"the-service-contract\">The service contract<\/h2>\n<table>\n<thead>\n<tr>\n<th>Endpoint<\/th>\n<th>Answers<\/th>\n<th>Who calls it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>/healthz<\/code><\/td>\n<td>Is the process up?<\/td>\n<td>The platform's liveness probe. Failing it restarts the container<\/td>\n<\/tr>\n<tr>\n<td><code>/readyz<\/code><\/td>\n<td>Can it score a ticket right now?<\/td>\n<td>The load balancer. Failing it stops traffic without a restart<\/td>\n<\/tr>\n<tr>\n<td><code>/triage<\/code><\/td>\n<td>The prediction, probabilities, the rule that fired, the model version<\/td>\n<td>Session 5's agent, and Session 6's router<\/td>\n<\/tr>\n<tr>\n<td><code>/metrics<\/code><\/td>\n<td>Counts, latency histogram, model version<\/td>\n<td>The scrape target for dashboards and alarms<\/td>\n<\/tr>\n<tr>\n<td><code>/version<\/code><\/td>\n<td>Everything in the artifact's metadata except the metrics<\/td>\n<td>Whoever asks \"which model is this\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A model that fails to load must leave the process alive and not ready. Crashing loops the restart and hides the log line that says why.<\/p>\n<h2 id=\"questions-worth-asking\">Questions worth asking<\/h2>\n<ul>\n<li>Northwind's P0 SLA is 15 minutes for Enterprise. What recall target does that imply, and what precision can the on-call team absorb?<\/li>\n<li>The threshold was chosen on the validation split. What happens when next quarter's tickets look different?<\/li>\n<li>What in this service would you have to change if the model became a transformer? What would stay?<\/li>\n<\/ul>\n<h2 id=\"what-you-built\">What you built<\/h2>\n<p>A calibrated four-class classifier behind a FastAPI service with liveness and readiness, Prometheus metrics, a correlation ID, a versioned artifact with a checksum and its own metrics report, and a container image with the model baked in. Session 5 calls it as a tool. Session 6 puts it in front of the agent as a cheap pre-filter.<\/p>", "steps": [{"title": "Look at the data and the feature pipeline", "check": "<code>uv run pytest -q tests/session02/test_features.py<\/code> passes and you can say what share of tickets is P0", "optional": false, "html": "<p>Project 1 starts with the data. Print the priority distribution before you train anything.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>python<span class=\"w\"> <\/span>-<span class=\"w\"> <\/span><span class=\"s\">&lt;&lt;'PY'<\/span>\n<span class=\"s\">import json, collections<\/span>\n<span class=\"s\">rows = [json.loads(l) for l in open(\"data/tickets.jsonl\")]<\/span>\n<span class=\"s\">c = collections.Counter(r[\"priority\"] for r in rows)<\/span>\n<span class=\"s\">for p in [\"P0\", \"P1\", \"P2\", \"P3\"]:<\/span>\n<span class=\"s\">    print(p, c[p], f\"{100 * c[p] / len(rows):.1f}%\")<\/span>\n<span class=\"s\">PY<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>About 8,000 tickets. P0 is a small single-digit percentage. Keep that number in mind for Step 2.<\/p>\n<\/div>\n<p>The feature pipeline in <code>nw/triage/features.py<\/code> is given. Read it: word and character TF-IDF over the subject and body, plus eight structural signals such as the share of capital letters and the number of pasted log lines. Every transform is a fitted scikit-learn object, so it serialises with the model and the service cannot tokenise differently from training.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session02/test_features.py\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Three pass. The first proves the same ticket produces the same vector before and after a reload.<\/p>\n<\/div>\n<p>Open <code>notebooks/session-02.ipynb<\/code> alongside. It imports from <code>nw.triage<\/code> and shows intermediate output as you go. Nothing the service depends on is defined there.<\/p>"}, {"title": "Train the model as given and read the confusion matrix", "check": "<code>make train-triage<\/code> prints a report and you have read the P0 row", "optional": false, "html": "<p>The training script is complete enough to run. Train it exactly as the skeleton ships.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>train-triage\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>A model version, then a table: majority baseline against the model, then the confusion matrix on the test split, rows true and columns predicted, P0 to P3. Accuracy around 0.68 and macro-F1 around 0.55 against a baseline of 0.41 and 0.15: the model is clearly learning something.<\/p>\n<\/div>\n<p>Now read the P0 row. Of the 31 real P0 tickets in the test split, how many did the model predict as P0? Read the \"P0 recall with plain argmax\" line too.<\/p>\n<p>Run the acceptance tests to see which criteria the model as shipped does not meet.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>session02\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Two failures and one error. <code>test_p0_recall_is_protected_by_the_threshold<\/code> says the P0 recall is below 0.8. <code>test_threshold_sweep_prefers_recall_target<\/code> says the sweep is not implemented. The error in the service tests is Step 6. Everything else already passes, which is the point: a model can pass most of a test suite and still be useless for the one thing the business needs.<\/p>\n<\/div>"}, {"title": "Class weights", "check": "P0 recall in the report went up and macro-F1 did not fall", "optional": false, "html": "<p>Open <code>nw/triage/train.py<\/code>, function <code>build_pipeline<\/code>. The classifier is built without class weights. Add <code>class_weight=class_weight<\/code> to the <code>LogisticRegression<\/code> so the loss charges a P0 mistake by the inverse of its frequency.<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"n\">clf<\/span> <span class=\"o\">=<\/span> <span class=\"n\">LogisticRegression<\/span><span class=\"p\">(<\/span><span class=\"n\">max_iter<\/span><span class=\"o\">=<\/span><span class=\"mi\">2000<\/span><span class=\"p\">,<\/span> <span class=\"n\">C<\/span><span class=\"o\">=<\/span><span class=\"n\">C<\/span><span class=\"p\">,<\/span> <span class=\"n\">class_weight<\/span><span class=\"o\">=<\/span><span class=\"n\">class_weight<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div>\n\n<p>Retrain and compare.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>train-triage\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Macro-F1 rises a few points and the \"P0 recall with plain argmax\" line rises to around 0.68, but not to the level the business needs. Weights move the boundary; they do not let you choose where it sits.<\/p>\n<\/div>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Note<\/p>\n<p>The notebook's third and fourth cells show the two confusion matrices side by side, naive and weighted. Look at where the P0 misses went.<\/p>\n<\/div>"}, {"title": "A threshold, not argmax", "check": "<code>uv run pytest -q tests/session02/test_training.py<\/code> passes", "optional": false, "html": "<p>Two functions this step.<\/p>\n<p><strong><code>choose_p0_threshold(proba_p0, y, target_recall, min_precision)<\/code><\/strong> in <code>train.py<\/code>. Sweep thresholds from 0.05 to 0.95 on the validation split. Return the lowest threshold that reaches the target P0 recall while keeping P0 precision at or above the floor. If no threshold does both, return the one with the best P0 F1.<\/p>\n<p><strong><code>TriageModel.decide(proba)<\/code><\/strong> in <code>model.py<\/code>. Predict P0 when its probability is at or above <code>self.p0_threshold<\/code>, and name the rule <code>p0&gt;=&lt;threshold&gt;<\/code>; otherwise the most likely class, rule <code>argmax<\/code>.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session02/test_training.py\nmake<span class=\"w\"> <\/span>train-triage\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>All training tests pass. The report's P0 recall is about 0.90 with the default target, P0 precision is under 0.5, and the chosen threshold is printed: on this data it is low, which tells you the model is not confident about P0 and the sweep had to reach down to catch them. The threshold and the two targets are the business decision; the code just enforces it.<\/p>\n<\/div>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Warning<\/p>\n<p>The sweep runs on the validation split, never the test split. The test split is the number you report; choosing on it makes that number a lie.<\/p>\n<\/div>"}, {"title": "Calibrate the probabilities", "check": "ECE in the report is lower than before calibration", "optional": false, "html": "<p>A threshold of 0.3 only means something if the probability is honest. In <code>train.py<\/code>, the calibration block in <code>train<\/code> currently keeps the raw pipeline. Replace it: freeze the fitted classifier, wrap it in <code>CalibratedClassifierCV<\/code> with the sigmoid method, and fit the wrapper on the validation split's features. Then build the final pipeline from the same feature object and the calibrated classifier.<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">sklearn.calibration<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CalibratedClassifierCV<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">sklearn.frozen<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">FrozenEstimator<\/span>\n\n<span class=\"n\">features<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pipeline<\/span><span class=\"o\">.<\/span><span class=\"n\">named_steps<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"features\"<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">clf<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pipeline<\/span><span class=\"o\">.<\/span><span class=\"n\">named_steps<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"clf\"<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">calibrated<\/span> <span class=\"o\">=<\/span> <span class=\"n\">CalibratedClassifierCV<\/span><span class=\"p\">(<\/span><span class=\"n\">FrozenEstimator<\/span><span class=\"p\">(<\/span><span class=\"n\">clf<\/span><span class=\"p\">),<\/span> <span class=\"n\">method<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"sigmoid\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">calibrated<\/span><span class=\"o\">.<\/span><span class=\"n\">fit<\/span><span class=\"p\">(<\/span><span class=\"n\">features<\/span><span class=\"o\">.<\/span><span class=\"n\">transform<\/span><span class=\"p\">(<\/span><span class=\"n\">val_rows<\/span><span class=\"p\">),<\/span> <span class=\"n\">labels<\/span><span class=\"p\">(<\/span><span class=\"n\">val_rows<\/span><span class=\"p\">))<\/span>\n<span class=\"n\">final<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Pipeline<\/span><span class=\"p\">([(<\/span><span class=\"s2\">\"features\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">features<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"s2\">\"clf\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">calibrated<\/span><span class=\"p\">)])<\/span>\n<span class=\"n\">classes<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">list<\/span><span class=\"p\">(<\/span><span class=\"n\">calibrated<\/span><span class=\"o\">.<\/span><span class=\"n\">classes_<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>train-triage\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>The Brier score for P0 lands around 0.014 and the ECE under 0.1. The threshold the sweep chooses may move, because the probabilities changed meaning. The notebook's last cell shows predicted confidence against actual accuracy per bucket; after this step the two columns agree.<\/p>\n<\/div>\n<div class=\"admonition agent\">\n<p class=\"admonition-title\">With the agent<\/p>\n<p>Ask <code>/code-review<\/code> whether calibration is fit on data the classifier has already seen. It should say no. If it says yes, one of you is wrong, and the test suite will not tell you which.<\/p>\n<\/div>"}, {"title": "Alive is not ready", "check": "<code>make session02<\/code> reports every test passed", "optional": false, "html": "<p>Open <code>nw/triage/service.py<\/code>. The model loads in <code>lifespan<\/code>. As shipped, a missing or corrupt artifact raises at startup, the process dies, and the platform restarts it in a loop while the one log line that explains the problem scrolls past.<\/p>\n<p>Wrap the load: on failure, keep the process up, set <code>state.ready<\/code> to false and the <code>nw_triage_model_loaded<\/code> gauge to 0, and log the path and the error. <code>/healthz<\/code> stays 200. <code>/readyz<\/code> and <code>/triage<\/code> return 503 until a model is loaded.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session02/test_service.py\nmake<span class=\"w\"> <\/span>session02\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Every Session 2 test passes. <code>test_missing_model_is_alive_but_not_ready<\/code> is the one this step fixes.<\/p>\n<\/div>\n<p>Run the service and talk to it.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>serve-triage\n<\/code><\/pre><\/div>\n\n<p>In a second terminal:<\/p>\n<div class=\"hl\"><pre><span><\/span><code>curl<span class=\"w\"> <\/span>-s<span class=\"w\"> <\/span>localhost:8001/readyz\ncurl<span class=\"w\"> <\/span>-s<span class=\"w\"> <\/span>-X<span class=\"w\"> <\/span>POST<span class=\"w\"> <\/span>localhost:8001/triage<span class=\"w\"> <\/span>-H<span class=\"w\"> <\/span><span class=\"s1\">'content-type: application/json'<\/span><span class=\"w\"> <\/span><span class=\"se\">\\<\/span>\n<span class=\"w\">  <\/span>-H<span class=\"w\"> <\/span><span class=\"s1\">'x-correlation-id: demo-1'<\/span><span class=\"w\"> <\/span><span class=\"se\">\\<\/span>\n<span class=\"w\">  <\/span>-d<span class=\"w\"> <\/span><span class=\"s1\">'{\"subject\":\"URGENT production down\",\"body\":\"All users get 502 errors since 7am, production is blocked.\"}'<\/span>\ncurl<span class=\"w\"> <\/span>-s<span class=\"w\"> <\/span>localhost:8001/metrics<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>grep<span class=\"w\"> <\/span>nw_triage\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Readiness names the model version. The prediction is P0 with the rule <code>p0&gt;=...<\/code>, four probabilities that sum to one, and the version. The service log line carries <code>correlation_id: demo-1<\/code>. The metrics output shows the request counter, the prediction counter by priority and rule, the latency histogram, and the model version as a label.<\/p>\n<\/div>"}, {"title": "Build the container", "check": "<code>docker run<\/code> of the image answers <code>/readyz<\/code> with the model version", "optional": false, "html": "<p>The <code>Dockerfile<\/code> is given. Read it before building: two stages, a non-root user, the model baked in at build time and loaded once at startup, a health check on <code>/readyz<\/code>, and a graceful shutdown timeout so in-flight requests finish on a rolling deploy.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>image-triage\ndocker<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>--rm<span class=\"w\"> <\/span>-p<span class=\"w\"> <\/span><span class=\"m\">8001<\/span>:8000<span class=\"w\"> <\/span>nw-triage\n<\/code><\/pre><\/div>\n\n<p>In a second terminal:<\/p>\n<div class=\"hl\"><pre><span><\/span><code>curl<span class=\"w\"> <\/span>-s<span class=\"w\"> <\/span>localhost:8001/readyz\ndocker<span class=\"w\"> <\/span><span class=\"nb\">history<\/span><span class=\"w\"> <\/span>nw-triage<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>head\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Readiness answers with the same model version as Step 6. The image history shows no layer copying <code>.env<\/code> or <code>data/<\/code>; <code>.dockerignore<\/code> keeps them out. The runtime image contains the virtualenv, the package and the model, nothing else.<\/p>\n<\/div>\n<p>Stop the container with Ctrl-C. It exits within the graceful timeout, not instantly.<\/p>"}, {"title": "Session check and commit", "check": "<code>/session-check 2<\/code> reports every criterion met", "optional": false, "html": "<p>In your agent:<\/p>\n<div class=\"hl\"><pre><span><\/span><code>/session-check 2\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Every Session 2 criterion met, with the test names as evidence, and the report from <code>artifacts/triage/latest/report.json<\/code> quoted for macro-F1 and P0 recall.<\/p>\n<\/div>\n<p>Commit the code, not the artifact. <code>artifacts/<\/code> is ignored; Session 6 builds the model in CI from the committed data.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>check\ngit<span class=\"w\"> <\/span>add<span class=\"w\"> <\/span>-A<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>git<span class=\"w\"> <\/span>commit<span class=\"w\"> <\/span>-m<span class=\"w\"> <\/span><span class=\"s2\">\"Session 2: triage scoring service\"<\/span>\n<\/code><\/pre><\/div>"}, {"title": "Argue with the threshold", "check": "You can state a recall target and a precision floor and defend both", "optional": true, "html": "<p>Retrain with a different target and read what it costs.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>python<span class=\"w\"> <\/span>-m<span class=\"w\"> <\/span>nw.triage.train<span class=\"w\"> <\/span>--target-recall<span class=\"w\"> <\/span><span class=\"m\">0<\/span>.97\nuv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>python<span class=\"w\"> <\/span>-m<span class=\"w\"> <\/span>nw.triage.train<span class=\"w\"> <\/span>--target-recall<span class=\"w\"> <\/span><span class=\"m\">0<\/span>.80\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>At 0.97 the threshold drops and P0 precision falls, sometimes below the floor, in which case the sweep falls back to the best-F1 threshold and the report says so. At 0.80 precision recovers. Neither is right. Northwind's Enterprise P0 SLA is 15 minutes: which number would you put in front of the on-call lead, and what do you tell them it costs per week in false alarms?<\/p>\n<\/div>"}]}, {"n": 3, "title": "Deep learning and representation", "builds": "Project 2: Semantic understanding engine", "reference_html": "<h2 id=\"situation\">Situation<\/h2>\n<p>Project 1 orders the queue by priority. It cannot say what a ticket is about. Northwind wants tags, several per ticket, so that \"SSO\" and \"Outage\" route to different people even when both are P1, and it wants \"similar past tickets\" in front of the agent before they type a reply. Both need a representation of the text richer than word counts. Project 2 fine-tunes a transformer encoder for tags and priority at once, exports it to a runtime that needs no PyTorch, and measures exactly what the extra cost buys over Project 1.<\/p>\n<h2 id=\"memory-arithmetic\">Memory arithmetic<\/h2>\n<p>Every number on the slide is derivable. DistilBERT has about 66 million parameters. Full fine-tuning in fp32 with Adam holds the weights, their gradients, and two optimiser moments: 16 bytes per parameter, about 1 GB before a single activation. Activations scale with batch size times sequence length times hidden size times layers. This is why \"it does not fit\" is usually the optimiser, not the model.<\/p>\n<p>LoRA changes the arithmetic. The encoder is frozen; small low-rank matrices are added to the query and value projections and only those, plus the two heads, train. The trainable fraction is under one percent, the optimiser state is negligible, and the whole thing runs on a laptop CPU in minutes on a 2,000 ticket subset.<\/p>\n<table>\n<thead>\n<tr>\n<th>Choice<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rank <code>r<\/code><\/td>\n<td>Capacity of the adapter. 8 is enough for classification; 64 for generation tasks<\/td>\n<\/tr>\n<tr>\n<td><code>alpha<\/code><\/td>\n<td>Scale of the adapter's contribution. Convention is 2 times <code>r<\/code><\/td>\n<\/tr>\n<tr>\n<td>Target modules<\/td>\n<td>Which linear layers get adapters. Attention query and value is the standard start<\/td>\n<\/tr>\n<tr>\n<td>Dropout<\/td>\n<td>Regularises the adapter; 0.05 by default<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"the-input-pipeline-is-usually-the-bottleneck\">The input pipeline is usually the bottleneck<\/h2>\n<p>People blame the accelerator. Profile first. Tokenising to a fixed maximum length wastes most of the compute on padding; dynamic padding to the longest in the batch is the single largest saving. On a laptop, the dataloader running in the main process is fine; on a GPU box, workers keep the device fed, and a deadlocked worker looks exactly like a slow GPU.<\/p>\n<h2 id=\"multi-label-is-not-multi-class\">Multi-label is not multi-class<\/h2>\n<p>Tags do not compete. A ticket can be both \"SSO\" and \"Outage\". The loss is binary cross-entropy per tag, not softmax across tags, and the decision is one threshold per tag chosen on validation, not argmax. A flat 0.5 under-predicts every rare tag. Priority stays a single-label head with weighted cross-entropy, the same imbalance lesson as Session 2 in a different loss.<\/p>\n<h2 id=\"checkpoints-that-resume\">Checkpoints that resume<\/h2>\n<p>A checkpoint that holds only the weights restarts Adam cold and the learning rate schedule from zero. Resume needs the adapter and head weights, the optimiser moments, the scheduler position, the epoch and step, and the best score so far, or the run after the crash is a different run.<\/p>\n<h2 id=\"export-and-the-serving-boundary\">Export and the serving boundary<\/h2>\n<p>ONNX is the pragmatic bridge: one graph, run by a small runtime with no PyTorch in the container. Export with dynamic batch and sequence axes or the graph only accepts the shape it was traced with. Prove parity on held-out tickets before trusting it. Dynamic int8 quantisation stores linear weights as 8-bit integers and needs no calibration set; it is the first thing to try on CPU, and it is judged by the benchmark's task metrics, not by logit equality.<\/p>\n<p>Where ONNX leaks: custom operators, data-dependent control flow, and anything the tracer turns into a constant. The export warnings are worth reading once.<\/p>\n<h2 id=\"the-benchmark-is-the-deliverable\">The benchmark is the deliverable<\/h2>\n<p>One table, same test split, same machine: Project 1's linear model against Project 2 in PyTorch, ONNX fp32, and ONNX int8. Priority macro-F1 and P0 recall, tag micro-F1 where the model has tags, p50 and p95 latency at batch size one, size on disk, and a cost per thousand tickets from a stated CPU price. Sessions 5 and 6 route on these numbers: the cheap model where it suffices, the expensive one where it earns its keep.<\/p>\n<p>Measured on the shipped checkpoint (2,000 ticket subset, six epochs) on an Apple silicon laptop, test split, batch size one:<\/p>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th style=\"text-align: right;\">Priority macro-F1<\/th>\n<th style=\"text-align: right;\">P0 recall<\/th>\n<th style=\"text-align: right;\">Tag micro-F1<\/th>\n<th style=\"text-align: right;\">p50 ms<\/th>\n<th style=\"text-align: right;\">p95 ms<\/th>\n<th style=\"text-align: right;\">Size MB<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Project 1: TF-IDF and logistic regression<\/td>\n<td style=\"text-align: right;\">0.663<\/td>\n<td style=\"text-align: right;\">0.903<\/td>\n<td style=\"text-align: right;\">n/a<\/td>\n<td style=\"text-align: right;\">1.7<\/td>\n<td style=\"text-align: right;\">2.3<\/td>\n<td style=\"text-align: right;\">6.8<\/td>\n<\/tr>\n<tr>\n<td>Project 2: PyTorch fp32<\/td>\n<td style=\"text-align: right;\">0.693<\/td>\n<td style=\"text-align: right;\">0.742<\/td>\n<td style=\"text-align: right;\">0.541<\/td>\n<td style=\"text-align: right;\">28.0<\/td>\n<td style=\"text-align: right;\">53.3<\/td>\n<td style=\"text-align: right;\">268.0<\/td>\n<\/tr>\n<tr>\n<td>Project 2: ONNX fp32<\/td>\n<td style=\"text-align: right;\">0.693<\/td>\n<td style=\"text-align: right;\">0.742<\/td>\n<td style=\"text-align: right;\">0.541<\/td>\n<td style=\"text-align: right;\">35.1<\/td>\n<td style=\"text-align: right;\">57.7<\/td>\n<td style=\"text-align: right;\">265.7<\/td>\n<\/tr>\n<tr>\n<td>Project 2: ONNX int8<\/td>\n<td style=\"text-align: right;\">0.682<\/td>\n<td style=\"text-align: right;\">0.677<\/td>\n<td style=\"text-align: right;\">0.522<\/td>\n<td style=\"text-align: right;\">12.5<\/td>\n<td style=\"text-align: right;\">18.2<\/td>\n<td style=\"text-align: right;\">66.8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Read it before the room does. The transformer buys three points of macro-F1 over the linear model at about fifteen times the latency, and its P0 recall is lower because Project 1's threshold rule protects P0 and argmax does not. Quantisation halves the latency and costs the rare class first. Project 1 stays in front of the agent as the cheap pre-filter in Session 6.<\/p>\n<h2 id=\"questions-worth-asking\">Questions worth asking<\/h2>\n<ul>\n<li>Project 2 is slower than Project 1 by a factor you measured. For which tickets is that factor worth paying?<\/li>\n<li>The German tickets are five percent of the data and the base model is English. Where do they land in the error analysis, and what would you change?<\/li>\n<li>If the customer's stack is TensorFlow Serving, what in this session transfers unchanged?<\/li>\n<\/ul>\n<h2 id=\"what-you-built\">What you built<\/h2>\n<p>An encoder with LoRA adapters and two heads, a training loop you can read, resumable checkpoints, per-tag thresholds, an ONNX export with parity proof and an int8 variant, a benchmark table against Project 1, a similarity index of past tickets, and a service that runs the quantised graph with no PyTorch in the image. Session 4 reuses the embedding model; Session 5 calls the service as a tool.<\/p>", "steps": [{"title": "Environment, device, and the memory arithmetic", "check": "<code>uv run python -c 'from nw.semantic.model import pick_device; print(pick_device())'<\/code> prints cuda, mps or cpu, and you know which", "optional": false, "html": "<p>Session 3 installs PyTorch and friends. If <code>make setup<\/code> ran before this session, run it again to pick up the deep learning extra.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>setup\nuv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>python<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span><span class=\"s2\">\"from nw.semantic.model import pick_device; print(pick_device())\"<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p><code>mps<\/code> on Apple silicon, <code>cuda<\/code> with an NVIDIA GPU, <code>cpu<\/code> otherwise. All three work for this session; the training subset is sized for CPU. If it prints <code>cpu<\/code> and training later takes longer than ten minutes, switch to the Colab fallback linked in the Reference tab and continue from Step 4 there.<\/p>\n<\/div>\n<p>Before touching a model, do the arithmetic. DistilBERT: about 66 million parameters. Full fine-tuning with Adam in fp32 is 16 bytes per parameter. Write down the number. Then read <code>nw/semantic/model.py<\/code> and find where LoRA changes it.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session03/test_data.py\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Three pass. The collate test proves dynamic padding: a batch is padded to its longest ticket, not to the maximum length.<\/p>\n<\/div>"}, {"title": "Read the loop and see the tests fail", "check": "<code>make session03<\/code> reports failures only in training, export and service tests", "optional": false, "html": "<p><code>nw/semantic/train.py<\/code> is a training loop written out in full, not a Trainer. Read it top to bottom once. The pieces you implement today are marked; everything around them, the schedule with warmup, the gradient scaler, the validation pass, the artifact metadata, is given.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>session03\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>The data and index tests pass. The training tests fail at <code>apply_lora<\/code>, which raises. Everything downstream of training fails for the same reason. That is the order of the next steps.<\/p>\n<\/div>\n<p>The tests run a tiny randomly initialised DistilBERT with a two-thousand word tokenizer, so they finish in seconds on CPU and download nothing. The real model comes in Step 5.<\/p>"}, {"title": "Freeze the encoder, inject LoRA", "check": "<code>uv run pytest -q tests/session03/test_training.py -k lora<\/code> passes", "optional": false, "html": "<p>Implement <code>apply_lora<\/code> in <code>nw/semantic/model.py<\/code>. Freeze every encoder parameter, build a <code>LoraConfig<\/code> from the spec (rank, alpha, dropout, target modules, no bias), wrap the encoder with <code>get_peft_model<\/code>, and return the model. The two heads stay trainable because they were never frozen.<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">peft<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">LoraConfig<\/span><span class=\"p\">,<\/span> <span class=\"n\">get_peft_model<\/span>\n\n<span class=\"k\">for<\/span> <span class=\"n\">p<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">encoder<\/span><span class=\"o\">.<\/span><span class=\"n\">parameters<\/span><span class=\"p\">():<\/span>\n    <span class=\"n\">p<\/span><span class=\"o\">.<\/span><span class=\"n\">requires_grad<\/span> <span class=\"o\">=<\/span> <span class=\"kc\">False<\/span>\n<span class=\"n\">cfg<\/span> <span class=\"o\">=<\/span> <span class=\"n\">LoraConfig<\/span><span class=\"p\">(<\/span><span class=\"n\">r<\/span><span class=\"o\">=<\/span><span class=\"n\">spec<\/span><span class=\"o\">.<\/span><span class=\"n\">lora_r<\/span><span class=\"p\">,<\/span> <span class=\"n\">lora_alpha<\/span><span class=\"o\">=<\/span><span class=\"n\">spec<\/span><span class=\"o\">.<\/span><span class=\"n\">lora_alpha<\/span><span class=\"p\">,<\/span> <span class=\"n\">lora_dropout<\/span><span class=\"o\">=<\/span><span class=\"n\">spec<\/span><span class=\"o\">.<\/span><span class=\"n\">lora_dropout<\/span><span class=\"p\">,<\/span>\n                 <span class=\"n\">target_modules<\/span><span class=\"o\">=<\/span><span class=\"nb\">list<\/span><span class=\"p\">(<\/span><span class=\"n\">spec<\/span><span class=\"o\">.<\/span><span class=\"n\">target_modules<\/span><span class=\"p\">),<\/span> <span class=\"n\">bias<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"none\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">encoder<\/span> <span class=\"o\">=<\/span> <span class=\"n\">get_peft_model<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">encoder<\/span><span class=\"p\">,<\/span> <span class=\"n\">cfg<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session03/test_training.py<span class=\"w\"> <\/span>-k<span class=\"w\"> <\/span>lora\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Passes. The test checks that the trainable count is a small fraction of the total, that the heads are trainable, and that no non-LoRA encoder parameter requires a gradient. Print the ratio out loud when you train the real model in Step 5; it is the number that makes this session possible on a laptop.<\/p>\n<\/div>"}, {"title": "The loss and the training step", "check": "<code>uv run pytest -q tests/session03/test_training.py -k learns<\/code> passes", "optional": false, "html": "<p>Two pieces in <code>train.py<\/code>.<\/p>\n<p><strong><code>loss_fn<\/code><\/strong>: binary cross-entropy with logits over the tag head against the multi-hot targets, plus cross-entropy over the priority head with the class weights passed in. Add them.<\/p>\n<p><strong>The training step<\/strong>, inside the batch loop:<\/p>\n<ol>\n<li>Forward under <code>torch.autocast(device_type=device.type, dtype=torch.float16, enabled=use_amp)<\/code>. Autocast is only enabled on CUDA; on CPU and MPS it is a no-op by design.<\/li>\n<li>Divide the loss by <code>accumulate<\/code>, then <code>scaler.scale(loss).backward()<\/code>.<\/li>\n<li>Every <code>accumulate<\/code> batches, or at the end of the loader: <code>scaler.unscale_(optimizer)<\/code>, clip the gradient norm to 1.0, <code>scaler.step(optimizer)<\/code>, <code>scaler.update()<\/code>, zero the gradients, step the scheduler, increment <code>step<\/code>, log every <code>log_every<\/code> steps.<\/li>\n<\/ol>\n<p>The finite-loss check after your block is given. Leave it: a NaN at step 40 is a learning rate problem and the message says so.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session03/test_training.py<span class=\"w\"> <\/span>-k<span class=\"w\"> <\/span>learns\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Passes: on the tiny synthetic corpus, three epochs reach tag micro-F1 and priority macro-F1 above 0.5, <code>best.pt<\/code>, <code>checkpoint.pt<\/code> and <code>tag_thresholds.npy<\/code> exist.<\/p>\n<\/div>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Warning<\/p>\n<p>If the loss never moves, check that you divided by <code>accumulate<\/code> before backward and not after, and that <code>optimizer.zero_grad<\/code> runs after the step, not before the backward.<\/p>\n<\/div>"}, {"title": "Per-tag thresholds, then train the real model", "check": "<code>make train-semantic<\/code> prints a trainable ratio under 2 percent and validation metrics per epoch", "optional": false, "html": "<p>Implement <code>tune_tag_thresholds<\/code>: for each tag with at least one positive in validation, sweep thresholds from 0.1 to 0.9 and keep the one with the best F1. Tags with no positives keep 0.5.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session03/test_training.py<span class=\"w\"> <\/span>-k<span class=\"w\"> <\/span>thresholds\n<\/code><\/pre><\/div>\n\n<p>Now the real model on the real data: DistilBERT from the Hub, a 2,000 ticket stratified subset, six epochs.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>train-semantic\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>The first run downloads the base model, about 260 MB. Then: the parameter line, <code>... trainable (0.xx%)<\/code>, a loss line every 20 steps, and after each epoch a validation line with tag micro-F1, tag macro-F1, priority macro-F1 and P0 recall. On Apple silicon the six epochs take about two minutes; on a CPU-only laptop, longer. Trainable parameters are about 0.3 percent. Validation reaches roughly tag micro-F1 0.55 and priority macro-F1 0.66 by the last epoch, with P0 recall above 0.8. <code>artifacts/semantic/best.pt<\/code> holds the best epoch.<\/p>\n<\/div>\n<div class=\"admonition note\">\n<p class=\"admonition-title\">Note<\/p>\n<p>The full-data checkpoint trained by the course team ships in <code>artifacts/semantic-full/<\/code>. Steps 6 to 8 work with either; the benchmark numbers in the Reference tab come from the full one.<\/p>\n<\/div>"}, {"title": "Checkpoints that resume", "check": "<code>uv run pytest -q tests/session03/test_training.py -k resume<\/code> passes", "optional": false, "html": "<p><code>save_checkpoint<\/code> as shipped saves only the weights. Make it save what a resume needs: the adapter and head weights (the frozen base is not worth writing), the optimiser state, the scheduler state, the epoch, the step, and the best score.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session03/test_training.py<span class=\"w\"> <\/span>-k<span class=\"w\"> <\/span>resume\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Passes. The test reloads <code>checkpoint.pt<\/code> into a fresh model and optimiser and asserts the optimiser has moments, then resumes for one more epoch into a new directory.<\/p>\n<\/div>\n<p>Prove it on the real run: interrupt training with Ctrl-C after the first epoch's validation line, then resume.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>python<span class=\"w\"> <\/span>-m<span class=\"w\"> <\/span>nw.semantic.train<span class=\"w\"> <\/span>--subset<span class=\"w\"> <\/span><span class=\"m\">2000<\/span><span class=\"w\"> <\/span>--epochs<span class=\"w\"> <\/span><span class=\"m\">2<\/span><span class=\"w\"> <\/span>--resume<span class=\"w\"> <\/span>artifacts/semantic/checkpoint.pt\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p><code>resumed from ... epoch 1, step N<\/code> and training continues from epoch 1, not epoch 0, with the learning rate where the schedule left it.<\/p>\n<\/div>"}, {"title": "Export to ONNX, quantise, prove parity", "check": "<code>make export-semantic<\/code> reports <code>parity_fp32_ok: true<\/code> and a size ratio above 2", "optional": false, "html": "<p>Implement <code>export_onnx<\/code> in <code>nw/semantic/export.py<\/code>. Wrap the model in <code>ExportWrapper<\/code>, tokenise one short sample, and call <code>torch.onnx.export<\/code> with named inputs and outputs and dynamic axes on batch and sequence for the inputs and batch for the outputs. Opset 17, <code>dynamo=False<\/code>.<\/p>\n<div class=\"hl\"><pre><span><\/span><code>uv<span class=\"w\"> <\/span>run<span class=\"w\"> <\/span>pytest<span class=\"w\"> <\/span>-q<span class=\"w\"> <\/span>tests/session03/test_export.py\nmake<span class=\"w\"> <\/span>export-semantic\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>Three tests pass. The export prints the fp32 and int8 sizes, the size ratio, and the maximum absolute logit difference for each against PyTorch on 20 held-out tickets. fp32 is under 1e-3. int8 is larger, and that is expected: it is judged in the next step by task metrics, not by logits. The tokenizer is saved next to the graphs so the runtime image never touches the Hub.<\/p>\n<\/div>\n<div class=\"admonition warning\">\n<p class=\"admonition-title\">Warning<\/p>\n<p>If parity fails only on the second ticket of a batch, the dynamic axes are wrong: the graph was traced for one shape.<\/p>\n<\/div>"}, {"title": "The benchmark table", "check": "<code>make benchmark<\/code> prints four rows with measured p50 and p95", "optional": false, "html": "<div class=\"hl\"><pre><span><\/span><code>make<span class=\"w\"> <\/span>benchmark\n<\/code><\/pre><\/div>\n\n<div class=\"admonition expect\">\n<p class=\"admonition-title\">What to expect<\/p>\n<p>One table: Project 1, Project 2 in PyTorch, ONNX fp32, and ONNX int8. Priority macro-F1 and P0 recall for all four, tag micro-F1 for the three Project 2 rows, p50 and p95 latency at batch size one on your CPU, size in MB, and a cost per thousand tickets at the CPU price stated in <code>benchmark.py<\/code>. Copy the
