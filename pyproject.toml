[project]
name = "nw"
version = "0.1.0"
description = "Northwind Cloud support-ticket intelligence: the AI Engineering course repository"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic[bedrock,vertex]>=1.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "rank-bm25>=0.2.2",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
]

[project.optional-dependencies]
mlops = [
    "mlflow>=3.0",
]
dl = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "sentence-transformers>=3.0",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "faiss-cpu>=1.8",
    "safetensors>=0.4",
]
agents = [
    "mcp>=1.10,<2",
]
# The Local track's platform clients (ADR 0011): MLflow registry and prompts, the Kubeflow
# Pipelines local runner, Qdrant. `pip` is here because the kfp local runner shells out to it
# and a uv virtualenv has none; `docker` is what the DockerRunner drives.
local = [
    "mlflow>=3.16",
    "kfp>=2.17",
    "qdrant-client>=1.19",
    "docker>=7.1",
    "pip>=25.0",
]
agents-aws = [
    "strands-agents>=1.0",
    "strands-agents-tools>=0.2",
    "boto3>=1.35",
    # 0.17 (opentelemetry-sdk 1.40) is the ADOT release the AWS, Google Cloud and Azure tracks
    # can share in one lock: 0.19+ pins SDK 1.44 past google-adk 2.x's cap (1.42.1), and 0.18's
    # SDK 1.42.1 matches no Azure Monitor exporter build. Revisit when ADK moves.
    "aws-opentelemetry-distro>=0.17.1,<0.18",
    "opentelemetry-sdk-extension-aws>=2.1",
    "opentelemetry-propagator-aws-xray>=1.0",
]
platform-aws = [
    # nw/platform/aws.py: SageMaker, Bedrock, AgentCore and the Agent Registry through boto3
    "boto3>=1.43",
]
agents-gcp = [
    "google-adk>=2.10",
    "google-cloud-secret-manager>=2.20",
    "opentelemetry-exporter-gcp-trace>=1.9",
    "opentelemetry-resourcedetector-gcp>=1.9",
]
# The training pipelines (ADR 0008, 0011): the Kubeflow SDK for the Local track and Vertex AI
# Pipelines, the SageMaker SDK v3 for AWS. Both define the same two pipelines over nw/pipelines/steps.
pipelines = [
    "kfp>=2.17",
    "sagemaker-mlops>=1.23",
]
platform-gcp = [
    # nw/platform/gcp.py and scripts/gcp_*.py: Model Registry, Pipelines, endpoints, prompt
    # management (vertexai.preview.prompts), RAG Engine (vertexai.rag), Agent Engine.
    "google-cloud-aiplatform>=1.120",
    "google-cloud-storage>=2.18",
    "google-cloud-logging>=3.11",
    "google-cloud-run>=0.10",
    "google-cloud-secret-manager>=2.20",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
# nw/platform/azure.py and nw/pipelines/azureml (ADR 0013): the Azure ML registry, pipelines and
# online endpoints, Foundry hosted agents (azure-ai-projects: HostedAgentDefinition, RaiConfig),
# AI Search, Blob Storage, Entra ID. Claude on Foundry needs nothing new: `anthropic` ships
# AsyncAnthropicFoundry. The Azure Monitor trace exporter (nw/telemetry.py): builds from b46 on
# pin opentelemetry-sdk to one minor (1.39, 1.40, 1.43, 1.44), so the lock takes ADOT 0.17 and
# SDK 1.40.0, which b53 and google-adk 2.10 both accept (relocked 2026-09-30; b45 failed to
# import against SDK 1.42.1). Azure traces go to Application Insights.
platform-azure = [
    "azure-ai-ml>=1.35",
    "azure-ai-projects>=2.7",
    "azure-identity>=1.25",
    "azure-monitor-opentelemetry-exporter>=1.0.0b53",
    "azure-search-documents>=12.0",
    "azure-storage-blob>=12.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nw"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "deploy/aws/.venv", "deploy/aws/cdk.out", "deploy/aws/cdk.out.test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"deploy/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "session01: Foundations and the AI service layer",
    "session02: Machine learning in production, Project 1 ticket triage",
    "session03: Deep learning and representation, Project 2 semantic understanding",
    "session04: Generative AI: retrieval and evaluation, Project 3 policy-grounded responses",
    "session05: Agentic AI systems, Project 4 multi-agent resolution",
    "session06: Deployment, observability and capstone",
    "live: needs cloud credentials and spends money, or the local compose stack running",
    "pipelines: the training pipelines, shared steps and both SDK definitions",
    "slow: takes more than a minute; excluded from the default run with -m 'not slow'",
]

# Linux images (Lambda, Cloud Run, AgentCore) get CPU-only PyTorch wheels: the default index
# resolves torch with the CUDA 13 stack, about 3 GB per image that no service uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
