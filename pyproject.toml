[project]
name = "nw"
version = "0.1.0"
description = "Northwind Cloud support-ticket intelligence: the AI Engineering course repository"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic[bedrock,vertex]>=1.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dl = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "sentence-transformers>=3.0",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "faiss-cpu>=1.8",
    "safetensors>=0.4",
]
agents = [
    "mcp>=1.10,<2",
]
agents-aws = [
    "strands-agents>=1.0",
    "strands-agents-tools>=0.2",
]
agents-gcp = [
    "google-adk>=1.10",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nw"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "deploy/aws/.venv", "deploy/aws/cdk.out", "deploy/aws/cdk.out.test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"deploy/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "session01: Session 1, the shared service layer",
    "session02: Session 2, Project 1 ticket triage",
    "session03: Session 3, Project 2 semantic understanding",
    "session04: Session 4, Project 3 policy-grounded responses",
    "session05: Session 5, Project 4 multi-agent resolution",
    "session06: Session 6, Capstone and deployment",
    "live: needs cloud credentials and spends money",
]
