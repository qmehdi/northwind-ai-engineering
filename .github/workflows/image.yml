# The supply chain gate for the service images. The triage image stands in for the four:
# they share the Dockerfile, the lock and the package, so a vulnerable base layer or a bad
# wheel shows up here first.
#
# - pull requests that touch the Dockerfile, the lock or the package: build, scan with
#   Trivy (CRITICAL and HIGH with a fix available fail the job), write an SBOM with Syft
#   and keep it as a run artifact.
# - main: the same, then push to the registry named by the repository variable
#   NW_IMAGE_REGISTRY (`ghcr.io/<owner>`, or `<account>.dkr.ecr.<region>.amazonaws.com/<ns>`)
#   tagged `sha-<commit>`, and sign the pushed digest with cosign keyless through the
#   job's GitHub OIDC identity (`permissions: id-token: write`). With the variable unset
#   the push and the signature are skipped with a notice and the job passes: the gate
#   never depends on a registry existing.
#
# Registry credentials: ghcr.io uses GITHUB_TOKEN (packages: write). Any other registry
# reads the repository secrets NW_REGISTRY_USERNAME and NW_REGISTRY_PASSWORD (for ECR: an
# `aws ecr get-login-password` token is short-lived, so use OIDC there instead; see
# deploy/aws/README.md).
#
# CI trains nothing, so the build gets an empty artifacts/triage/latest: the image is a
# supply chain object here, scanned and signed, never served.
#
# Two jobs, so the token matches the job: `scan` runs on every event with a read-only token;
# `publish` runs only on main, after `scan` passed, and is the only job that may write
# packages or mint an OIDC token. It signs the digest it pushed and then verifies that
# signature against this workflow's exact identity, so a signature that would not verify at
# deploy time fails here first. Verify by hand with
#   cosign verify \
#     --certificate-identity https://github.com/<owner>/<repo>/.github/workflows/image.yml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com <registry>/nw-triage@<digest>
# Every third-party action is pinned by commit SHA with its release in a comment.
name: image
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - uv.lock
      - pyproject.toml
      - nw/**
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - uv.lock
      - pyproject.toml
      - nw/**
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: nw-triage
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Placeholder artifact (CI trains nothing; the image is scanned, not served)
        run: |
          mkdir -p artifacts/triage/latest
          echo '{"version": "ci-placeholder"}' > artifacts/triage/latest/metadata.json
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            APP=nw.triage.service:app
            ARTIFACTS=triage
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (CRITICAL and HIGH with a fix available fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (immutable release, after the March 2026 tag hijack)
        with:
          image-ref: ${{ env.IMAGE }}:ci
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: SBOM with Syft (SPDX JSON, kept as a run artifact)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ env.IMAGE }}.spdx.json
          upload-artifact: true

  publish:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # ghcr.io push with GITHUB_TOKEN
      id-token: write   # keyless cosign signature through the job's OIDC identity
    steps:
      - name: No registry configured
        if: vars.NW_IMAGE_REGISTRY == ''
        run: echo "::notice::NW_IMAGE_REGISTRY is not set; the image was built, scanned and inventoried, not pushed or signed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.NW_IMAGE_REGISTRY != ''
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: vars.NW_IMAGE_REGISTRY != ''
      - name: Placeholder artifact
        if: vars.NW_IMAGE_REGISTRY != ''
        run: |
          mkdir -p artifacts/triage/latest
          echo '{"version": "ci-placeholder"}' > artifacts/triage/latest/metadata.json
      - name: Registry host
        id: registry
        if: vars.NW_IMAGE_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.NW_IMAGE_REGISTRY }}
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
      - name: Registry login
        if: vars.NW_IMAGE_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ steps.registry.outputs.host == 'ghcr.io' && github.actor || secrets.NW_REGISTRY_USERNAME }}
          password: ${{ steps.registry.outputs.host == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.NW_REGISTRY_PASSWORD }}
      - name: Push (the scanned build, from the cache)
        id: push
        if: vars.NW_IMAGE_REGISTRY != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ vars.NW_IMAGE_REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            APP=nw.triage.service:app
            ARTIFACTS=triage
          cache-from: type=gha
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: vars.NW_IMAGE_REGISTRY != ''
      - name: Sign the pushed digest (keyless, GitHub OIDC, recorded in Rekor)
        if: vars.NW_IMAGE_REGISTRY != ''
        env:
          REF: ${{ vars.NW_IMAGE_REGISTRY }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Verify the signature against this workflow's identity
        if: vars.NW_IMAGE_REGISTRY != ''
        env:
          REF: ${{ vars.NW_IMAGE_REGISTRY }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@refs/heads/main
        run: |
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" > /dev/null
          echo "verified $REF"
