# The agent's regression gate. Two jobs:
#
# - `offline` runs on every dispatch with no credentials. First the two AgentOps checks:
#   every agent in code has an approved use case whose allowed tools cover what it sees
#   (`nw.agent.catalog --check`), and every agent card in data/agents matches the code it
#   describes: tools, prompt hash, version (`nw.agent.registry --check`). Then the fifteen
#   adversarial cases go through the real loop, registry and scorer with a scripted model
#   that follows each case's expectations, and the tiered gate (tool, turn, session, system)
#   compares the result with the bars in data/golden/agent_baseline.json. It proves the
#   loop, the tools, the scorer, the catalog, the registry and the gate still agree; it
#   proves nothing about a model. It costs nothing.
# - `gate` runs against a real track and spends about 2.5 USD per run. It needs cloud
#   credentials, so it is never part of the push CI: configure an OIDC role for GitHub
#   Actions in your account and store its ARN as the repository secret AWS_ROLE_ARN (or
#   GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT for the gcp track), and the URLs
#   of the deployed Project 1 to 3 services as NW_TRIAGE_URL, NW_SEMANTIC_URL and
#   NW_POLICY_URL: the tools call them over HTTP because the artifacts they would load in
#   process do not exist in CI.
#
# Pass counts move by one or two between identical runs; the gate allows one. A failure on
# the pass count alone is a reason to run it again before it is a reason to stop a release.
name: agent-gate
on:
  workflow_dispatch:
    inputs:
      track:
        description: aws or gcp
        default: aws
        type: choice
        options: [aws, gcp]
      live:
        description: also run the fifteen cases against the track (about 2.5 USD)
        default: "false"
        type: choice
        options: ["false", "true"]
      write_baseline:
        description: a passed live gate replaces data/golden/agent_baseline.json in the run's artifact
        default: "false"
        type: choice
        options: ["false", "true"]
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra agents
      - name: Every agent in code has an approved use case that allows its tools
        env:
          NW_TRACK: local
        run: uv run python -m nw.agent.catalog --check
      - name: Every agent card matches the code it describes
        env:
          NW_TRACK: local
        run: uv run python -m nw.agent.registry --check
      - name: The adversarial set through the loop with a scripted model, then the tiered gate
        env:
          NW_TRACK: local
        run: uv run python -m nw.agent.evaluate --provider fake --gate --out artifacts/agent_eval_offline.json --traces artifacts/traces-offline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-eval-offline
          path: |
            artifacts/agent_eval_offline.json
            artifacts/agent_gate.jsonl
  gate:
    if: inputs.live == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra agents --extra agents-aws --extra agents-gcp
      - if: inputs.track == 'aws'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - if: inputs.track == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: The catalog and the registry, before any model is paid for
        env:
          NW_TRACK: ${{ inputs.track }}
        run: |
          uv run python -m nw.agent.catalog --check
          uv run python -m nw.agent.registry --check
      - name: Run the adversarial set on the track and apply the tiered gate (plus one Judge call per case)
        env:
          NW_TRACK: ${{ inputs.track }}
          NW_AWS_REGION: us-east-1
          NW_GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          NW_SPEND_CAP_USD: "6"
          NW_TRIAGE_URL: ${{ secrets.NW_TRIAGE_URL }}
          NW_SEMANTIC_URL: ${{ secrets.NW_SEMANTIC_URL }}
          NW_POLICY_URL: ${{ secrets.NW_POLICY_URL }}
        run: |
          if [ "${{ inputs.write_baseline }}" = "true" ]; then uv run python -m nw.agent.evaluate --backend http --gate --write-baseline; else uv run python -m nw.agent.evaluate --backend http --gate; fi
      - name: The escalation queue must not exist after an evaluation
        run: test ! -f artifacts/escalations.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-eval-${{ inputs.track }}
          path: |
            artifacts/agent_eval.json
            artifacts/agent_gate.jsonl
            artifacts/traces
            data/golden/agent_baseline.json
