# A release is a tag. `make release VERSION=x.y.z` bumps pyproject, moves the changelog's
# Unreleased section under the version, commits and tags `vx.y.z`; pushing the tag runs
# this workflow, which:
#
# - checks the tag against pyproject.toml, so a tag never claims a version the package
#   does not carry (`x-nw-version` on every response comes from that field);
# - publishes a GitHub release whose body is that version's CHANGELOG.md section;
# - when the repository variable NW_IMAGE_REGISTRY is set, retags the images the `image`
#   workflow pushed for the tagged commit (`sha-<commit>`) as `vx.y.z`. A retag is a
#   manifest operation: nothing is rebuilt, and the cosign signature on the digest still
#   verifies. Before a retag the digest's signature is verified against the `image`
#   workflow's identity on main; an image that is pushed but unsigned, or signed by anyone
#   else, fails the release instead of being tagged. Without the variable, or without a
#   pushed image for the commit, the step prints a warning and the release still succeeds;
#   registry secrets are never required.
#
# Every third-party action is pinned by commit SHA with its release in a comment; the token
# is read-only at the top and the release job asks for exactly what it writes.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      packages: write   # the version tag on ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must match pyproject.toml
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PY=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "$VERSION" = "$PY" || { echo "tag v$VERSION but pyproject.toml says $PY"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "$VERSION" > release-notes.md && cat release-notes.md
      - name: Publish the GitHub release (the runner's gh, no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "v$VERSION" --notes-file release-notes.md --verify-tag
      - name: Registry host
        id: registry
        if: vars.NW_IMAGE_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.NW_IMAGE_REGISTRY }}
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
      - name: Registry login
        if: vars.NW_IMAGE_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ steps.registry.outputs.host == 'ghcr.io' && github.actor || secrets.NW_REGISTRY_USERNAME }}
          password: ${{ steps.registry.outputs.host == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.NW_REGISTRY_PASSWORD }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: vars.NW_IMAGE_REGISTRY != ''
      - name: Verify, then tag the commit's images with the version
        if: vars.NW_IMAGE_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.NW_IMAGE_REGISTRY }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@refs/heads/main
        run: |
          for image in nw-triage nw-semantic nw-policy nw-agent nw-mcp; do
            src="$REGISTRY/$image:sha-$COMMIT"
            if digest=$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}' 2>/dev/null); then
              ref="$REGISTRY/$image@$digest"
              cosign verify --certificate-identity "$IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null \
                || { echo "::error::$ref is not signed by the image workflow; not tagged"; exit 1; }
              docker buildx imagetools create -t "$REGISTRY/$image:v$VERSION" "$ref"
              echo "verified and tagged $REGISTRY/$image:v$VERSION ($ref)"
            else
              echo "::warning::$src was never pushed; nothing to tag for $image"
            fi
          done
      - name: No registry configured
        if: vars.NW_IMAGE_REGISTRY == ''
        run: echo "::notice::NW_IMAGE_REGISTRY is not set; release published, no image tags"
