# The Project 3 release gate. Two jobs, two prices.
#
# retrieval (every pull request that touches the corpus, the policy package, the prompts or
# the golden set; also on demand): no cloud credentials and no model call. It builds the
# index from the pull request's corpus (downloads the embedding model and the reranker once,
# about 180 MB, cached between runs), runs `build_index --check` so an index that does not
# match its corpus can never be baked into an image, and runs the harness in
# `--retrieval-only` mode: recall@k and MRR against data/golden/baseline.json, tolerance 0.03.
# Cost: CI minutes only.
#
# gate (on demand only, `gh workflow run eval-gate -f track=aws -f judge=false`): the same
# index, then the full harness on a real track through OpenID Connect. `--no-judge` answers
# every golden case with the Workhorse, about 1 USD; `judge=true` adds the faithfulness Judge,
# about 6 USD, and is the run whose eval.json becomes the next baseline. Configure an OIDC
# role for GitHub Actions and store its ARN as the repository secret AWS_ROLE_ARN (or
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT and GCP_PROJECT for the gcp track).
#
# What each run records: the prompt versions, the corpus hash and the index manifest travel in
# eval.json, so a moved number can be traced to the prompt, the corpus or the model. A baseline
# measured on another corpus or with another prompt prints a WARNING, not a failure.
name: eval-gate
on:
  pull_request:
    paths:
      - data/policies/**
      - data/golden/policy_qa.jsonl
      - data/golden/baseline.json
      - nw/policy/**
      - nw/llm/prompts/**
      - .github/workflows/eval-gate.yml
  workflow_dispatch:
    inputs:
      track:
        description: aws or gcp
        default: aws
        type: choice
        options: [aws, gcp]
      judge:
        description: run the faithfulness judge (about 6 USD) or the Workhorse only (about 1 USD)
        default: "false"
        type: choice
        options: ["false", "true"]
jobs:
  retrieval:
    name: retrieval gate (free, no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra dl
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}
      - name: Registered prompts and their hashes
        run: uv run python -m nw.llm.prompts
      - name: Build the policy index from this corpus
        run: uv run python -m nw.policy.build_index
      - name: The index must match the corpus it claims
        run: uv run python -m nw.policy.build_index --check
      - name: Retrieval-only harness against the baseline
        env:
          NW_TRACK: local
        run: uv run python -m nw.policy.evaluate --retrieval-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: policy-eval-retrieval
          path: |
            artifacts/policy/eval.json
            artifacts/policy/manifest.json
  gate:
    name: full gate on a track (on demand, costs money)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra dl
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}
      - if: inputs.track == 'aws'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - if: inputs.track == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Build the policy index
        run: uv run python -m nw.policy.build_index
      - name: The index must match the corpus it claims
        run: uv run python -m nw.policy.build_index --check
      - name: Run the golden set and apply the gate
        env:
          NW_TRACK: ${{ inputs.track }}
          NW_AWS_REGION: us-east-1
          NW_GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          NW_SPEND_CAP_USD: "12"
        run: |
          if [ "${{ inputs.judge }}" = "true" ]; then uv run python -m nw.policy.evaluate; else uv run python -m nw.policy.evaluate --no-judge; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: policy-eval-${{ inputs.track }}
          path: |
            artifacts/policy/eval.json
            artifacts/policy/manifest.json
