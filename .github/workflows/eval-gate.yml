# The Project 3 release gate. Three jobs, three prices.
#
# retrieval (every pull request that touches the corpus, the policy package, the prompts or
# the golden set; also on demand): no cloud credentials and no model call. It builds the
# index from the pull request's corpus (downloads the embedding model and the reranker once,
# about 180 MB, cached between runs), runs `build_index --check` so an index that does not
# match its corpus can never be baked into an image, and runs the harness in
# `--retrieval-only` mode on the held-out gate split against
# data/golden/baselines/policy-retrieval_only.json: recall@k and recall@1 as counts of flipped
# cases (one allowed), MRR as a mean (0.03 allowed). A baseline without provenance fails.
# Cost: CI minutes only.
#
# generation (every pull request that changes a registered prompt or the answer code): a
# prompt change is a model-behaviour change, and retrieval cannot see it. The Workhorse
# answers the gate split without the Judge (`--no-judge`, about 0.05 USD) on the track in the
# repository variable NW_EVAL_TRACK (aws when unset), and the gate compares key-fact
# correctness, citation recall, citation validity and refusal correctness with that track's
# baseline, data/golden/baselines/policy-<track>-no_judge.json. Make this job a required
# status check in branch protection. It needs the track's OIDC secrets (below); a pull
# request from a fork has none and fails, which is the point: a prompt change is not merged
# unmeasured. A pull request that changes no prompt passes this job in seconds.
#
# gate (on demand only, `gh workflow run eval-gate -f track=aws -f judge=false`): the full
# harness on a track. `judge=true` adds the faithfulness Judge, about 0.35 USD, and gates
# faithfulness only when artifacts/policy/judge_calibration.json measured the same Judge id
# (run `make calibrate-judge` first; the report is uploaded). `write_baseline=true` writes this
# track's baseline when none exists or the gate passed; it lands in the run's artifact, and a
# person commits it to data/golden/baselines/. Configure an OIDC role and store its ARN as
# AWS_ROLE_ARN (aws), GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT and GCP_PROJECT
# (gcp), or AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (azure).
#
# Every run records its provenance in eval.json (mode, track, split, model ids for Workhorse,
# Judge, embedder and reranker, prompt versions, corpus and golden hashes) and appends the
# decision, with the Judge model id, to artifacts/policy/eval_gate.jsonl.
name: eval-gate
on:
  pull_request:
    paths:
      - data/policies/**
      - data/golden/policy_qa.jsonl
      - data/golden/baselines/**
      - nw/policy/**
      - nw/llm/prompts/**
      - .github/workflows/eval-gate.yml
  workflow_dispatch:
    inputs:
      track:
        description: aws, gcp or azure
        default: aws
        type: choice
        options: [aws, gcp, azure]
      judge:
        description: run the faithfulness judge (about 0.35 USD) or the Workhorse only (about 0.05 USD)
        default: "false"
        type: choice
        options: ["false", "true"]
      write_baseline:
        description: write this track's baseline into the run's artifact when the gate passes
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
jobs:
  retrieval:
    name: retrieval gate (free, no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra dl
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}
      - name: Registered prompts and their hashes
        run: uv run python -m nw.llm.prompts
      - name: Build the policy index from this corpus
        run: uv run python -m nw.policy.build_index
      - name: The index must match the corpus it claims
        run: uv run python -m nw.policy.build_index --check
      - name: Retrieval-only harness on the gate split against the provenanced baseline
        env:
          NW_TRACK: local
        run: uv run python -m nw.policy.evaluate --retrieval-only --require-baseline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: policy-eval-retrieval
          path: |
            artifacts/policy/eval.json
            artifacts/policy/eval_gate.jsonl
            artifacts/policy/manifest.json
  generation:
    name: generation gate on prompt changes (required, about 0.05 USD)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TRACK: ${{ vars.NW_EVAL_TRACK || 'aws' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did this pull request change a prompt or the answer code?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -E '^nw/llm/prompts/|^nw/policy/answer\.py$|^nw/policy/evaluate\.py$'; then
            echo "prompts=true" >> "$GITHUB_OUTPUT"
          else
            echo "prompts=false" >> "$GITHUB_OUTPUT"
            echo "no prompt or answer code changed: nothing for the generation gate to measure"
          fi
      - if: steps.changed.outputs.prompts == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - if: steps.changed.outputs.prompts == 'true'
        run: uv python install 3.12 && uv sync --locked --extra dev --extra dl
      - if: steps.changed.outputs.prompts == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}
      - if: steps.changed.outputs.prompts == 'true' && env.TRACK == 'aws'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - if: steps.changed.outputs.prompts == 'true' && env.TRACK == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - if: steps.changed.outputs.prompts == 'true' && env.TRACK == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - if: steps.changed.outputs.prompts == 'true'
        name: Build the index, then the Workhorse answers the gate split (no Judge)
        env:
          NW_TRACK: ${{ env.TRACK }}
          NW_AWS_REGION: us-east-1
          NW_GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          NW_SPEND_CAP_USD: "3"
        run: |
          uv run python -m nw.policy.build_index
          uv run python -m nw.policy.evaluate --no-judge --require-baseline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.changed.outputs.prompts == 'true'
        with:
          name: policy-eval-generation
          path: |
            artifacts/policy/eval.json
            artifacts/policy/eval_gate.jsonl
  gate:
    name: full gate on a track (on demand, costs money)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra dl
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}
      - if: inputs.track == 'aws'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - if: inputs.track == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - if: inputs.track == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build the policy index
        run: uv run python -m nw.policy.build_index
      - name: The index must match the corpus it claims
        run: uv run python -m nw.policy.build_index --check
      - name: Calibrate the Judge on this track (judged runs only, about 0.65 USD)
        if: inputs.judge == 'true'
        env:
          NW_TRACK: ${{ inputs.track }}
          NW_AWS_REGION: us-east-1
          NW_GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: uv run python -m nw.policy.calibrate
      - name: Run the gate split and apply the gate
        env:
          NW_TRACK: ${{ inputs.track }}
          NW_AWS_REGION: us-east-1
          NW_GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          NW_SPEND_CAP_USD: "12"
          JUDGE: ${{ inputs.judge }}
          WRITE: ${{ inputs.write_baseline }}
        run: |
          flags=""
          if [ "$JUDGE" != "true" ]; then flags="--no-judge"; fi
          if [ "$WRITE" = "true" ]; then flags="$flags --write-baseline"; fi
          uv run python -m nw.policy.evaluate $flags
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: policy-eval-${{ inputs.track }}
          path: |
            artifacts/policy/eval.json
            artifacts/policy/eval_gate.jsonl
            artifacts/policy/judge_calibration.json
            artifacts/policy/manifest.json
            data/golden/baselines/
