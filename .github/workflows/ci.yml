name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra dl --extra agents --extra agents-aws --extra agents-gcp
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q $(cat tests/skeleton-green.txt)
