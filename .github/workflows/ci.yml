name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
# Least privilege: the job reads the repository and nothing else. Every third-party action is
# pinned by commit SHA with its release in a comment; a moved tag cannot change what runs.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra dl --extra mlops --extra agents --extra agents-aws --extra agents-gcp --extra pipelines --extra local --extra platform-aws --extra platform-gcp --extra platform-azure
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q @tests/skeleton-green.txt
