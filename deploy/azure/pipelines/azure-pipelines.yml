# Delivery for the Azure track (ADR 0012, 0013): Azure Pipelines builds the live images once,
# releases them by digest as a canary revision of the live Container Apps, and waits for a
# person before the canary takes all the traffic. Pull-request checks stay in GitHub Actions.
#
# Setup, once, in the Azure DevOps project (deploy/azure/README.md, "Delivery"):
#   1. Two service connections, Azure Resource Manager, workload identity federation (manual):
#      `northwind-builder` bound to the managed identity `northwind-builder` (output
#      NW_AZURE_BUILDER_CLIENT_ID; image pushes only) and `northwind-deployer` bound to
#      `northwind-deployer` (NW_AZURE_DEPLOYER_CLIENT_ID). Deploy the platform with NW_ADO_ISSUER,
#      NW_ADO_BUILDER_SUBJECT and NW_ADO_SUBJECT set to what the connections show, so each
#      identity trusts its own connection. Restrict `northwind-deployer` to this pipeline
#      (Security, Pipeline permissions) and to `main` (a Branch control check on the connection),
#      so no other pipeline or branch can sign in as the deployer.
#   2. Two environments: `northwind-canary` (no checks) and `northwind-live` with an Approvals
#      check (Environments, northwind-live, Approvals and checks). Approvals are not YAML: the
#      resource owner sets them, which is the point.
#   3. A pipeline from this file on the GitHub repository (Azure Pipelines GitHub app).
#
# The rights (deploy/azure/modules/delivery.bicep): the builder pushes images; the deployer holds
# a custom role on the live apps only (a new revision, the traffic split), the endpoint role on
# the live online endpoints, and reads the alerts. Nothing on any tenant's app.

trigger:
  branches:
    include: [main]
pr: none

variables:
  environment: northwind
  resourceGroup: rg-northwind
  serviceConnection: northwind-deployer
  builderConnection: northwind-builder
  canaryPercent: 10

stages:
  - stage: Build
    displayName: Build the live images once
    jobs:
      - job: images
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1
          - task: AzureCLI@2
            displayName: outputs.json from the platform deployment
            inputs:
              azureSubscription: $(builderConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                NW_ENVIRONMENT=$(environment) NW_AZURE_RESOURCE_GROUP=$(resourceGroup) scripts/deploy_azure.sh outputs
          - script: |
              curl -fsSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
              echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  /tmp/cosign" | sha256sum -c -
              sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
            displayName: Install cosign (images are signed with the Key Vault key)
          - task: AzureCLI@2
            displayName: Build and push policy, agent and mcp (tag = commit)
            inputs:
              azureSubscription: $(builderConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                docker buildx create --use >/dev/null
                NW_IMAGE_TAG=$(git rev-parse --short HEAD) IMAGES="policy agent mcp" scripts/images_azure.sh

  - stage: Canary
    displayName: Canary revision at $(canaryPercent) percent
    dependsOn: Build
    jobs:
      - deployment: canary
        environment: $(environment)-canary
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - script: |
                    curl -fsSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
                    echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  /tmp/cosign" | sha256sum -c -
                    sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
                  displayName: Install cosign (release verifies the signature)
                - task: AzureCLI@2
                  displayName: Release by digest
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      export NW_ENVIRONMENT=$(environment) NW_AZURE_RESOURCE_GROUP=$(resourceGroup)
                      scripts/deploy_azure.sh outputs
                      NW_IMAGE_TAG=$(git rev-parse --short HEAD) NW_CANARY_PERCENT=$(canaryPercent) scripts/deploy_azure.sh release

  - stage: Promote
    displayName: Promote after approval
    dependsOn: Canary
    jobs:
      # The environment's Approvals check holds this job until a person approves in the portal.
      - deployment: promote
        environment: $(environment)-live
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - task: AzureCLI@2
                  displayName: Canary to 100 percent unless a live alert fires
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      export NW_ENVIRONMENT=$(environment) NW_AZURE_RESOURCE_GROUP=$(resourceGroup)
                      scripts/deploy_azure.sh outputs
                      REASON="Azure Pipelines run $(Build.BuildNumber) approved" scripts/deploy_azure.sh approve
