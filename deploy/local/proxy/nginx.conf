# The weighted proxy in front of the serving tier: one door, two replicas, weights from
# upstream.conf (written by `make local-canary WEIGHT=<percent>`, reloaded without a restart).
# nginx rejects weight=0, so a replica at zero percent is marked `down` instead.
events {}
http {
    include /etc/nginx/nw/upstream.conf;
    server {
        listen 8000;
        location /healthz { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
        location = /weights { alias /etc/nginx/nw/weights.json; default_type application/json; }
        location / {
            proxy_pass http://serving;
            proxy_set_header Host $host;
            proxy_set_header X-Replica $upstream_addr;
            add_header X-Upstream $upstream_addr always;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
