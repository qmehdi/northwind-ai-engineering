# Loaded instead of config.yaml when ANTHROPIC_API_KEY is set: the Judge role reaches Claude,
# everything else stays on Ollama. The course client asks for `claude-opus-5` by name (the
# LOCAL_CLOUD_JUDGE constant in nw/config.py); `judge` is the same deployment.
model_list:
  - model_name: gpt-oss:20b
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: gpt-oss:120b
    litellm_params:
      model: ollama_chat/gpt-oss:120b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  # The smaller-model fallback for a 16 GB Mac (docker-compose.small.yml, SMALL=1).
  - model_name: qwen3:4b
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: workhorse
    litellm_params:
      model: os.environ/NW_GATEWAY_WORKHORSE
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: economy
    litellm_params:
      model: os.environ/NW_GATEWAY_LOCAL_MODEL
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: judge
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: guard
    litellm_params:
      model: ollama_chat/llama-guard3:1b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL

guardrails:
  - guardrail_name: llama-guard
    litellm_params:
      guardrail: llama_guard.LlamaGuard
      mode: pre_call
      default_on: true
      guard_model: guard

litellm_settings:
  drop_params: true
  request_timeout: 300
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
