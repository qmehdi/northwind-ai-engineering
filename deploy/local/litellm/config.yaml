# The model gateway (ADR 0008, 0011): the one door every model call goes through. Model
# names are the course's role ids from nw/config.py, so a service that sets NW_GATEWAY_URL
# needs no other change. Without a cloud key the Judge name stays on the fake provider in the
# course client; the `judge` alias here exists so an explicit NW_MODEL_JUDGE=judge has a
# local (weaker) judge to fall back on. With ANTHROPIC_API_KEY set, the container starts
# from config-cloud-judge.yaml instead, which adds Claude under its own name.
model_list:
  - model_name: gpt-oss:20b
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: gpt-oss:120b
    litellm_params:
      model: ollama_chat/gpt-oss:120b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  # The smaller-model fallback for a 16 GB Mac (docker-compose.small.yml, SMALL=1).
  - model_name: qwen3:4b
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: workhorse
    litellm_params:
      model: os.environ/NW_GATEWAY_WORKHORSE
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: economy
    litellm_params:
      model: os.environ/NW_GATEWAY_LOCAL_MODEL
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: judge
    litellm_params:
      model: os.environ/NW_GATEWAY_LOCAL_MODEL
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL
  - model_name: guard
    litellm_params:
      model: ollama_chat/llama-guard3:1b
      api_base: os.environ/NW_OLLAMA_INTERNAL_URL

guardrails:
  - guardrail_name: llama-guard
    litellm_params:
      guardrail: llama_guard.LlamaGuard   # deploy/local/litellm/llama_guard.py, beside this file
      mode: pre_call
      default_on: true
      guard_model: guard

litellm_settings:
  drop_params: true
  request_timeout: 300
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
